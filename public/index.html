<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>TorLink</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Cairo:wght@400;600;700&family=Suez+One&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0e0e10;--bg2:#141417;--card:#1a1a1e;--card2:#212126;--line:#2b2b32;--line2:#383841;
  --ink:#f4efe6;--muted:#9a948a;--dim:#6d685f;
  --gold:#c9a45c;--gold2:#e8cb8a;--gold-soft:rgba(201,164,92,.12);--gold-line:rgba(201,164,92,.35);
  --red:#cf4a3f;--ok:#4cb37d;--warn:#e0a83e;--blue:#5b8def;--wa:#25d366;
  --r:18px;--display:'Suez One','Reem Kufi',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:'Heebo','Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(900px 420px at 85% -10%,var(--glow),transparent 60%),radial-gradient(700px 400px at 0% 0%,var(--glow2),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.ic{width:18px;height:18px;stroke-width:1.8;flex:none;vertical-align:middle}
.ic.sm{width:15px;height:15px}.ic.lg{width:24px;height:24px}.ic.xl{width:30px;height:30px}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(14,14,16,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.3px}
.brand .mk{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1408}
.brand b{color:var(--gold)}
.sp{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button,.seg a{background:none;border:0;color:var(--muted);padding:6px 11px;border-radius:9px;font-size:13px;font-weight:600;text-decoration:none}
.seg .on{background:var(--gold);color:var(--on)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 90px}
/* hero */
.hero{position:relative;margin:16px 0 18px;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(600px 220px at 100% 0%,var(--gold-soft),transparent 70%),linear-gradient(160deg,var(--card2),var(--bg2) 60%)}
.hero .pole{height:8px;background:repeating-linear-gradient(-45deg,#c0453b 0 12px,#f4efe6 12px 24px,#28406e 24px 36px,#f4efe6 36px 48px);opacity:.85}
.hero .pole.accent{background:repeating-linear-gradient(-45deg,var(--gold) 0 12px,var(--gold2) 12px 24px,var(--gold-soft) 24px 36px,var(--gold2) 36px 48px);opacity:.9}
.hero-in{padding:22px 20px 20px;display:flex;gap:16px;align-items:center}
.logo{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--gold2);
  background:radial-gradient(circle at 30% 25%,var(--card2),var(--bg2));border:2px solid var(--gold-line);box-shadow:0 0 0 6px var(--gold-soft),0 10px 30px rgba(0,0,0,.35);overflow:hidden}
.logo .ic{width:34px;height:34px}
.hero h1{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;letter-spacing:.3px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;color:var(--muted);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(76,179,125,.18)}
.dot.off{background:var(--red);box-shadow:0 0 0 3px rgba(207,74,63,.18)}
/* nav pills */
.nav{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.nav button{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav .cnt{background:var(--gold);color:var(--on);border-radius:999px;font-size:11px;padding:0 7px;font-weight:800}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card.flat{background:var(--bg2)}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 14px;letter-spacing:.2px}
h3{font-size:14px;margin:18px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.sub{color:var(--muted);font-size:13px;margin:-8px 0 14px}
.list{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:.15s}
.opt:hover{border-color:var(--gold-line);transform:translateY(-1px)}
.opt .n{font-weight:700;font-size:15px}.opt .m{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px;margin-top:2px}
.opt .pr{margin-inline-start:auto;font-weight:800;color:var(--gold2);white-space:nowrap;font-size:16px}
.tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--gold2);background:linear-gradient(145deg,rgba(201,164,92,.18),rgba(201,164,92,.04));border:1px solid var(--gold-line)}
.tile .ic{width:22px;height:22px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:var(--card2);border:2px solid var(--line2);color:var(--ink);font-size:16px}
.av.vip{border-color:var(--gold);color:var(--gold2)}.av.gold{border-color:#d8b46a}.av.silver{border-color:#b9bcc4}
.steps{display:flex;gap:6px;margin:0 0 16px}.steps i{flex:1;height:3px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:9px 10px;min-width:64px;text-align:center;color:var(--ink)}
.chip b{display:block;font-size:19px;font-weight:800}.chip small{color:var(--muted);font-size:11px}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--on)}.chip.on small{color:var(--on);opacity:.7}
.chip:disabled{opacity:.35;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:14px}
.slot{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 0;font-weight:700;direction:ltr;color:var(--ink)}
.slot:hover{border-color:var(--gold);color:var(--gold2)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.pill.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold2)}
.empty{color:var(--muted);text-align:center;padding:26px 6px}
.empty .ic{width:34px;height:34px;color:var(--dim);display:block;margin:0 auto 8px}
label.f{display:block;margin-bottom:12px}label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
input[type=text],input[type=tel],input[type=number],input[type=time],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--line2);border-radius:12px;padding:11px 13px;background:var(--bg2);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
input::placeholder,textarea::placeholder{color:var(--dim)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 24px var(--gold-soft)}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.dark{background:var(--card2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.danger{background:var(--red);color:#fff;box-shadow:none}
.btn.okb{background:var(--ok);color:#06180e;box-shadow:none}
.btn.wa{background:var(--wa);color:#05210f;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.back{background:none;border:0;color:var(--muted);padding:0;margin-bottom:12px;font-size:14px;display:inline-flex;gap:4px;align-items:center}
.sum{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;gap:10px}.sum div span:first-child{color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.sum .old{text-decoration:line-through;color:var(--dim)}
.okc{width:76px;height:76px;border-radius:50%;margin:4px auto 12px;display:grid;place-items:center;color:var(--on);background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 0 0 10px var(--gold-soft)}
.okc.x{background:var(--card2);color:var(--muted);box-shadow:none}
.okc .ic{width:36px;height:36px;stroke-width:2.4}
.center{text-align:center}
.wa-box{background:#0f1f16;border:1px solid #1d3b2a;border-radius:16px;padding:12px;margin-top:14px}
.wa-box .lbl{font-size:12px;color:#7fd8a4;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.bub{background:#1d2b23;color:#e8f3ec;border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:14px;white-space:pre-line;word-break:break-word}
.err{color:#ff8a7e;font-size:13px;margin:8px 0}
.info-box{background:rgba(224,168,62,.08);border:1px solid rgba(224,168,62,.3);border-radius:14px;padding:11px 13px;font-size:13px;color:#f0c97a;margin-bottom:14px;display:flex;gap:8px}
.ok-box{background:rgba(76,179,125,.08);border:1px solid rgba(76,179,125,.3);border-radius:14px;padding:11px 13px;font-size:13px;color:#8fe0b4;margin-bottom:14px;display:flex;gap:8px}
/* club card */
.club{position:relative;border-radius:22px;padding:20px;overflow:hidden;color:#f8f1e2;border:1px solid var(--gold-line);
  background:radial-gradient(500px 200px at 100% 0%,var(--club-glow),transparent 60%),linear-gradient(135deg,var(--club1),#111012 70%)}
.club:after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;border-radius:50%;border:30px solid rgba(255,255,255,.04)}
.club .tier{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--club-ink)}
.club .nm{font-family:var(--display);font-size:24px;margin:6px 0 2px}
.club .punch{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px}
.club .punch i{width:26px;height:26px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.3);display:grid;place-items:center}
.club .punch i.on{background:var(--club-ink);border:0;color:#141210}
.club .punch i.gift{border-style:solid;border-color:var(--club-ink);color:var(--club-ink)}
.club .hint{font-size:13px;color:#d9ccb0}
/* shop */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.prod .pic{height:96px;border-radius:14px;display:grid;place-items:center;color:var(--gold2);background:radial-gradient(circle at 50% 40%,rgba(201,164,92,.22),rgba(201,164,92,.03) 70%),var(--bg2);border:1px solid var(--line)}
.prod .pic .ic{width:40px;height:40px;stroke-width:1.5}
.prod .n{font-weight:700;line-height:1.3}.prod .d{color:var(--muted);font-size:12px;min-height:32px}
.prod .pr{font-weight:800;color:var(--gold2);font-size:17px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);display:grid;place-items:center}
.qty b{min-width:20px;text-align:center}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));width:min(788px,calc(100% - 32px));z-index:15}
.cartbar .btn{width:100%;justify-content:space-between;padding:15px 20px;font-size:15px}
/* admin */
.ahead{display:flex;align-items:center;gap:14px;margin:16px 0}
.ahead .logo{width:52px;height:52px}.ahead .logo .ic{width:24px;height:24px}
.ahead h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none;position:sticky;top:57px;z-index:10;background:linear-gradient(var(--bg) 70%,transparent);padding-top:6px}
.tabs button{flex:none;display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:9px 13px;font-size:13px;font-weight:700}
.tabs button.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold2)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpis.k3{grid-template-columns:repeat(3,1fr)}.kpis.k2{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600}
.kpi b{display:block;font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.3px}
.kpi.hl{background:linear-gradient(135deg,var(--gold-soft),transparent),var(--card);border-color:var(--gold-line)}.kpi.hl b{color:var(--gold2)}
.kpi .ic{color:var(--gold)}
.bk{display:flex;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:var(--card2);position:relative}
.bk:before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--gold)}
.bk.arrived:before{background:var(--ok)}.bk.noshow:before{background:var(--red)}.bk.cancelled{opacity:.5}.bk.cancelled:before{background:var(--dim)}
.bk .tm{font-weight:800;direction:ltr;min-width:50px;font-size:16px}.bk .tm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.bk .info{flex:1;min-width:0}.bk .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lnk{background:none;border:0;padding:0;color:var(--ink);font-weight:700;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold2);font-weight:700;white-space:nowrap}
.badge.arrived,.badge.sent,.badge.active,.badge.picked{background:rgba(76,179,125,.12);color:#8fe0b4}
.badge.noshow,.badge.failed,.badge.blocked,.badge.lost{background:rgba(207,74,63,.14);color:#ff9a8f}
.badge.cancelled{background:#2a2a30;color:var(--muted)}
.badge.demo,.badge.risk,.badge.new,.badge.ready{background:rgba(224,168,62,.12);color:#f0c97a}
.badge.fresh{background:rgba(91,141,239,.14);color:#9dbbff}
.note{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse}td,th{padding:10px 4px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}
th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}td.num,th.num{text-align:end;white-space:nowrap}
.bar{display:grid;grid-template-columns:70px 1fr 44px;gap:10px;align-items:center;margin-bottom:8px;font-size:13px}
.bar .tr{background:var(--bg2);border-radius:6px;height:10px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.crow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:start;color:var(--ink)}
.crow:hover{background:var(--card2)}
.crow .mid{flex:1;min-width:0}.crow .nm{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crow .sm{color:var(--muted);font-size:12px}
.crow .val{text-align:end;white-space:nowrap}.crow .val b{color:var(--gold2)}
.prof{display:flex;gap:16px;align-items:center}
.prof .av{width:68px;height:68px;font-size:24px;border-width:3px}
.prof h2{margin:0}
.stgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tagb{border:1px dashed var(--line2);background:none;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.tagb.on{border-style:solid;border-color:var(--gold);color:var(--gold2);background:var(--gold-soft)}
.timeline{display:flex;flex-wrap:wrap;gap:6px}
.timeline span{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--muted)}
.ed{display:grid;grid-template-columns:44px 1fr 1fr 64px 64px 30px;gap:6px;align-items:center;margin-bottom:8px}
.ed input{padding:9px}
.icbtn{width:44px;height:42px;border-radius:12px;border:1px solid var(--gold-line);background:var(--gold-soft);color:var(--gold2);display:grid;place-items:center}
.x{background:none;border:0;color:#ff8a7e;display:grid;place-items:center}.x:disabled{opacity:.25}
.hrs{display:grid;grid-template-columns:86px 44px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.sw{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw:checked{background:var(--gold)}.sw:checked:after{inset-inline-end:21px}
.link{display:flex;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;direction:ltr;font-size:13px;word-break:break-all}
.msg{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card2)}
.msg .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
.ord{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:var(--card2)}
.ord .code{font-family:var(--display);font-size:20px;color:var(--gold2);direction:ltr}
.sect{display:flex;align-items:center;gap:8px;margin:0 0 12px}.sect h2{margin:0}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:40}
.toast.on{opacity:1;transform:translateX(-50%)}
.login{max-width:400px;margin:40px auto}
.login .logo{margin:0 auto 14px}

/* ---- branding ---- */
.ic.fill{fill:currentColor}
.logo img{width:100%;height:100%;object-fit:contain;padding:9%}
.logo.lbg{background:#fff}.logo.dbg{background:#151517}
.tagline{color:var(--muted);font-size:14px;margin-top:3px}
.rating{display:inline-flex;align-items:center;gap:4px;color:var(--gold2);font-weight:800}
.socials{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 18px}
.soc{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;transition:.15s}
.soc:hover{border-color:var(--gold);color:var(--gold2);transform:translateY(-1px)}
.sect-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sect-h h2{margin:0;font-size:19px}
.gal{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.gal button{flex:none;width:132px;height:160px;border-radius:16px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--card2)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.revs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.rev{flex:none;width:260px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.rev .st{color:var(--gold2);display:flex;gap:2px}
.rev p{margin:8px 0;font-size:14px;line-height:1.55}
.rev .who{font-size:12px;color:var(--muted)}
.rev .rp{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--gold-soft);font-size:12px}
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0 14px}
.stars button{background:none;border:0;color:var(--line2);padding:2px}
.stars button.on{color:var(--gold)}
.stars .ic{width:38px;height:38px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:grid;place-items:center;padding:20px}
.lightbox img{max-width:100%;max-height:88vh;border-radius:14px}
.sw-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line2);cursor:pointer;padding:0}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
input[type=color]{width:44px;height:44px;border:0;background:none;padding:0;cursor:pointer}
.up{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.up input{display:none}
.bigLogo{width:110px;height:110px;margin:0 auto 12px}
.bigLogo .ic{width:46px;height:46px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gcell{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card2)}
.gcell img{width:100%;height:100%;object-fit:cover}
.gcell .x{position:absolute;top:4px;inset-inline-end:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff}
.gadd{aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line2);display:grid;place-items:center;color:var(--muted);cursor:pointer;text-align:center;font-size:12px}
.gadd input{display:none}
.roww{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.roww .crow{border-bottom:0;flex:1}
.cal-add{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--gold2);text-decoration:none;margin-top:10px}
/* light mode */
body.light{--bg:#f6f4f0;--bg2:#efebe5;--card:#ffffff;--card2:#faf8f4;--line:#e7e1d7;--line2:#d6cfc3;--ink:#1c1a17;--muted:#6e685e;--dim:#a39c90}
body.light .top{background:rgba(255,255,255,.85)}
body.light .wa-box{background:#ebf8f0;border-color:#cdebd8}body.light .wa-box .lbl{color:#1d8248}body.light .bub{background:#fff;color:#1c1a17}
body.light .info-box{color:#8a5a00}body.light .ok-box{color:#1d7a45}body.light .err{color:#c0392b}
body.light .badge{filter:brightness(.6) saturate(1.3)}
body.light .opt:hover,body.light .card{box-shadow:0 1px 2px rgba(0,0,0,.04)}
@media (max-width:620px){
  .kpis{grid-template-columns:repeat(2,1fr)}.stgrid{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:24px}.logo{width:62px;height:62px}
  .ed{grid-template-columns:40px 1fr 1fr 54px 50px 24px}
}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
</style>

const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgbHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(h,to,k)=>{const a=hexRgb(h),b=hexRgb(to);return rgbHex(a.map((v,i)=>v+(b[i]-v)*k))};
const rgba=(h,a)=>{const [r,g,b]=hexRgb(h);return `rgba(${r},${g},${b},${a})`};
const lum=h=>{const c=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
function applyTheme(th){
  th=th||{accent:'#c9a45c',mode:'dark'};
  const a=/^#[0-9a-f]{6}$/i.test(th.accent)?th.accent:'#c9a45c',light=th.mode==='light';
  document.body.classList.toggle('light',light);
  const r=document.documentElement.style;
  // in light mode the "bright" accent must be darker so text stays readable
  const a2=light?mix(a,'#000000',.28):mix(a,'#ffffff',.32);
  const set={'--gold':a,'--gold2':a2,'--gold-soft':rgba(a,light?.10:.13),'--gold-line':rgba(a,.38),'--on':lum(a)>.42?'#141210':'#ffffff',
    '--glow':rgba(a,light?.10:.11),'--glow2':rgba(mix(a,'#ff3355',.5),light?.04:.05),
    '--club1':mix(a,'#000000',.72),'--club-glow':rgba(mix(a,'#ffffff',.3),.32),'--club-ink':mix(a,'#ffffff',.45)};
  for(const k in set)r.setProperty(k,set[k]);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=light?'#f6f4f0':'#0e0e10';
}
/* logo color extraction: most frequent saturated hues, weighted by saturation */
function paletteFrom(img){
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  x.drawImage(img,0,0,64,64);const d=x.getImageData(0,0,64,64).data;
  const bins={};let lumSum=0,n=0;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<200)continue;
    const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
    lumSum+=.2126*r+.7152*g+.0722*b;n++;
    const s=mx===mn?0:(l>.5?(mx-mn)/(2-mx-mn):(mx-mn)/(mx+mn));
    if(s<.22||l<.14||l>.88)continue;
    let h=mx===r?(g-b)/(mx-mn)+(g<b?6:0):mx===g?(b-r)/(mx-mn)+2:(r-g)/(mx-mn)+4;
    const k=Math.floor(h/6*24)%24,w=s*(1-Math.abs(l-.5));
    const o=bins[k]||(bins[k]={w:0,r:0,g:0,b:0,c:0});o.w+=w;o.r+=d[i];o.g+=d[i+1];o.b+=d[i+2];o.c++;
  }
  const cols=Object.values(bins).sort((p,q)=>q.w-p.w).slice(0,5).map(o=>rgbHex([o.r/o.c,o.g/o.c,o.b/o.c]));
  return {colors:cols,darkLogo:n?lumSum/n<.4:false};
}
const PRESET_COLORS=['#c9a45c','#b8862f','#cf4a3f','#2f6fd6','#2e9e6a','#8a5cd1','#d58fa6','#9aa3ad'];
async function fileToImg(file){
  const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});
  return await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});
}
function logoDataUrl(img){
  const S2=512,c=document.createElement('canvas');c.width=c.height=S2;const x=c.getContext('2d');
  const k=Math.min(S2/img.width,S2/img.height),w=img.width*k,h=img.height*k;
  x.imageSmoothingQuality='high';x.drawImage(img,(S2-w)/2,(S2-h)/2,w,h);
  let u=c.toDataURL('image/png');if(u.length>600000)u=c.toDataURL('image/webp',.9);return u;
}
function photoDataUrl(img){
  const M=1080,k=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let q=.84,u=c.toDataURL('image/jpeg',q);while(u.length>600000&&q>.4){q-=.12;u=c.toDataURL('image/jpeg',q)}return u;
}

const IMG={};
function img(slug,which,v,cls=''){
  if(!PREVIEW)return `<img class="${cls}" src="/api/img/${slug}/${which}?v=${v||0}" alt="" loading="lazy">`;
  const k=slug+'/'+which;
  if(IMG[k])return `<img class="${cls}" src="${IMG[k]}" alt="">`;

}
async function hydrate(k){
  if(IMG[k]!==undefined)return;IMG[k]='';
  try{const r=await api('GET','/img/'+k+'?json=1');IMG[k]=r.src;document.querySelectorAll(`img[data-pending="${k}"]`).forEach(i=>{i.src=r.src;i.removeAttribute('data-pending')})}catch(e){delete IMG[k]}

function socialLinks(b){

/* ===================== API ===================== */
async function api(method,url,body,pin){
  let res;
  try{res=await fetch('/api'+url,{method,headers:{'content-type':'application/json',...(pin?{'x-admin-pin':pin}:{})},body:body?JSON.stringify(body):undefined})}
  catch(e){throw {code:'network'}}
  const j=await res.json().catch(()=>({}));
  if(!res.ok)throw {code:j.error||'server_error',status:res.status};
  return j;
}

async function loadSlots(auto){
  const date=cb.date;cb.slots=null;cb.err='';render();
  const q=new URLSearchParams({slug:S.biz.slug,date,staff:cb.staffId||'any'});
  if(cb.resched)q.set('ignore',cb.resched);else q.set('service',cb.serviceId);
  try{
    const r=await api('GET','/slots?'+q);
    if(cb.date!==date)return;
    // date was chosen for the customer and is full → jump to the next open day with free times
    if(auto&&!r.slots.length&&auto<10){
      let k=date;for(let i=0;i<14;i++){k=addDaysK(k,1);if(S.biz.hours[wd(k)].open)break}
      if(dayNo(k)-dayNo(S.today)<21){cb.date=k;return loadSlots(auto+1)}
    }
    cb.slots=r.slots;render();
    if(auto){const ch=document.querySelector('.chip.on');if(ch)ch.scrollIntoView({inline:'center',block:'nearest'})}
  }
  catch(e){cb.slots=[];cb.err=errMsg(e.code);render()}
}
const firstOpen=()=>{for(let i=0;i<21;i++){const k=addDaysK(S.today,i);if(S.biz.hours[wd(k)].open)return k}return S.today};
async function submitBooking(){
  cb.err='';
  try{
    cb.busy=true;render();
    if(cb.resched){
      cb.done=await api('POST',`/booking/${cb.resched}/reschedule`,{date:cb.date,time:cb.time,staffId:cb.staffId});
    }else{
      const name=cb.name.trim(),phone=cb.phone.replace(/\D/g,'');
      if(!name)throw {code:'bad_name'};
      if(!/^05\d{8}$/.test(phone))throw {code:'bad_phone'};
      store.set('tl-name',name);store.set('tl-phone',cb.phone);
      cb.done=await api('POST','/book',{slug:S.biz.slug,serviceId:cb.serviceId,staffId:cb.staffId,date:cb.date,time:cb.time,name,phone,lang});
    }
    window.scrollTo(0,0);
  }catch(e){
    if(e.code==='taken'){cb.step=2;cb.err=errMsg('taken');loadSlots()}
    else cb.err=errMsg(e.code,S.biz.cutoff);
  }
  cb.busy=false;render();
}

async function getRange(from,to,force){
  const key=from+'_'+to;
  if(!force&&A.cache[key])return A.cache[key];
  const r=await api('GET',`/admin/${A.biz.slug}/bookings?from=${from}&to=${to}`,null,A.pin);
  A.cache[key]=r.bookings;return r.bookings;
}
const calRange=()=>[addDaysK(S.today,-3),addDaysK(S.today,14)];
function periodRange(p){
  const td=S.today,y=+td.slice(0,4),m=+td.slice(5,7);
  if(p==='week'){const s=addDaysK(td,-wd(td));return [s,addDaysK(s,6)]}
  const last=(yy,mm)=>new Date(Date.UTC(yy,mm,0)).getUTCDate();
  if(p==='month')return [`${y}-${pad(m)}-01`,`${y}-${pad(m)}-${pad(last(y,m))}`];
  if(p==='last'){const yy=m===1?y-1:y,mm=m===1?12:m-1;return [`${yy}-${pad(mm)}-01`,`${yy}-${pad(mm)}-${pad(last(yy,mm))}`]}
  return [addDaysK(td,-29),td];
}
async function loadClients(){const r=await api('GET',`/admin/${A.biz.slug}/clients`,null,A.pin);A.clients=r.clients;return r.clients}
async function loadOrders(){const r=await api('GET',`/admin/${A.biz.slug}/orders?months=3`,null,A.pin);A.orders=r.orders;return r.orders}
async function loadTab(force){
  tabData=null;render();
  try{
    if(A.tab==='cal'){const [b]=await Promise.all([getRange(...calRange(),force),(force||!A.clients)?loadClients():0,(force||!A.orders)?loadOrders():0]);tabData=b}
    else if(A.tab==='report'){const [b,rv]=await Promise.all([getRange(...periodRange(A.period),force),api('GET',`/admin/${A.biz.slug}/reviews`,null,A.pin),loadOrders()]);A.reviews=rv.reviews;A.biz.rating=rv.rating;tabData=b}
    else if(A.tab==='clients'){await loadClients();tabData=[]}
    else if(A.tab==='store'){await loadOrders();tabData=[]}
    else if(A.tab==='msgs'){const r=await api('GET',`/admin/${A.biz.slug}/messages`,null,A.pin);A.wa=r.waConnected;tabData=r.messages}
    else tabData=[];
  }catch(e){if(e.code==='bad_pin')return logout();toast(errMsg(e.code));tabData=[]}
  render();
}
/* --- client analytics --- */
const tierOf=v=>v>=30?'vip':v>=15?'gold':v>=5?'silver':'member';
function analyze(c){
  const ds=c.visitDates||[];
  let gap=null;
  if(ds.length>=2){let s=0;for(let i=1;i<ds.length;i++)s+=dayNo(ds[i])-dayNo(ds[i-1]);gap=Math.max(1,Math.round(s/(ds.length-1)))}
  const since=c.last?dayNo(S.today)-dayNo(c.last):null;
  let status;
  if(!c.visits)status='fresh';
  else{const g=gap||30;status=since>g*2.5&&since>45?'lost':since>g*1.5&&since>21?'risk':'active'}
  const every=Math.max(2,A.biz.club.rewardEvery),earned=Math.floor(c.visits/every),avail=Math.max(0,earned-(c.rewardsUsed||0));
  const fav=Object.entries(c.services||{}).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);
  const att=c.visits+c.noshows;
  return {gap,since,status,next:c.last&&gap?addDaysK(c.last,gap):null,avgTicket:c.visits?Math.round(c.spend/c.visits):0,
    noshowRate:att?Math.round(c.noshows*100/att):0,tier:tierOf(c.visits),avail,progress:c.visits%every,every,fav,
    isNew:c.first>=Date.UTC(+S.today.slice(0,4),+S.today.slice(5,7)-1,1)-3*3600e3,ltv:c.spend+(c.productSpend||0)};
}

function reportData(list){
  const [from,to]=periodRange(A.period);
  const by=s=>list.filter(b=>b.status===s);
  const arrived=by('arrived'),noshow=by('noshow'),cancelled=by('cancelled'),confirmed=by('confirmed');
  const live=[...arrived,...confirmed];
  const sum=a=>a.reduce((x,b)=>x+b.price,0);
  const workDays=new Set(arrived.map(b=>b.date)).size||1;
  const group=(keyFn,nameFn)=>{const m=new Map();live.forEach(b=>{const k=keyFn(b);const g=m.get(k)||{name:nameFn(b),n:0,rev:0};g.n++;if(b.status==='arrived')g.rev+=b.price;m.set(k,g)});return [...m.values()].sort((a,b)=>b.rev-a.rev||b.n-a.n)};
  const cm=new Map();arrived.forEach(b=>{const c=cm.get(b.phone)||{name:b.name,phone:b.phone,n:0,rev:0};c.n++;c.rev+=b.price;cm.set(b.phone,c)});
  const fromTs=Date.UTC(+from.slice(0,4),+from.slice(5,7)-1,+from.slice(8,10))-3*3600e3,toTs=Date.UTC(+to.slice(0,4),+to.slice(5,7)-1,+to.slice(8,10)+1)-2*3600e3;
  const prod=(A.orders||[]).filter(o=>o.status==='picked'&&o.created>=fromTs&&o.created<toTs).reduce((a,o)=>a+o.total,0);
  return {from,to,total:live.length+noshow.length,arrived:arrived.length,noshow:noshow.length,cancelled:cancelled.length,revenue:sum(arrived),prod,expected:sum(confirmed),
    avg:Math.round(sum(arrived)/workDays),rate:arrived.length+noshow.length?Math.round(noshow.length*100/(arrived.length+noshow.length)):0,
    bySvc:group(b=>b.serviceId,b=>tx(b.serviceName)),byStaff:group(b=>b.staffId,b=>tx(stf(b.staffId)?.name)||'—'),
    byDay:[0,1,2,3,4,5,6].map(i=>live.filter(b=>wd(b.date)===i).length),top:[...cm.values()].sort((a,b)=>b.rev-a.rev||b.n-a.n).slice(0,5)};
}

    h+=`<label class="row between f"><span style="margin:0;font-size:14px;color:var(--ink)">${t('clubOn')}</span><input type="checkbox" class="sw" id="clubOn" ${B.club.enabled?'checked':''}></label>
     <label class="f"><span>${t('rewardEvery')}</span><input type="number" min="2" max="50" id="clubEvery" value="${B.club.rewardEvery}"></label>
     <label class="f"><span>${t('rewardHe')}</span><input type="text" data-club="he" value="${esc(B.club.reward.he)}"></label>
     <label class="f"><span>${t('rewardAr')}</span><input type="text" data-club="ar" value="${esc(B.club.reward.ar)}"></label>
     <p class="note">${t('clubNote')}</p>${clubCardHtml({enabled:true,visits:7,every:B.club.rewardEvery,progress:7%B.club.rewardEvery,available:0,reward:B.club.reward,tier:'silver',name:lang==='ar'?'مثال':'דוגמה'})}`;
  }
  return h+`</div>`;
}
async function loadSwatches(){
  A.swatches=[];
  try{
    const src=PREVIEW?(IMG[A.biz.slug+'/logo']||(await api('GET',`/img/${A.biz.slug}/logo?json=1`)).src):`/api/img/${A.biz.slug}/logo?v=${A.biz.logoV}`;
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
    A.swatches=paletteFrom(im).colors;render();
  }catch(e){}
}
async function uploadLogo(file){
  try{
    toast(t('processing'));
    const im=await fileToImg(file),src=logoDataUrl(im),pal=paletteFrom(im);
    const r=await api('PUT',`/admin/${A.biz.slug}/logo`,{src},A.pin);
    IMG[A.biz.slug+'/logo']=src;
    A.biz=r.biz;A.swatches=pal.colors;
    // brand color + logo background follow the logo automatically (can be changed after)
    if(pal.colors[0])A.biz.theme.accent=pal.colors[0];
    A.biz.theme.logoBg=pal.darkLogo&&A.biz.theme.mode!=='light'?'light':'';
    render();saveConfig(true);toast(t('logoDone'));
  }catch(e){toast(errMsg(e.code||'bad_image'))}
}
async function uploadGallery(files){
  for(const f of [...files].slice(0,12-A.biz.gallery.length)){
    try{toast(t('processing'));const src=photoDataUrl(await fileToImg(f));
      const r=await api('POST',`/admin/${A.biz.slug}/gallery`,{src},A.pin);IMG[A.biz.slug+'/g/'+r.biz.gallery[0]]=src;A.biz=r.biz;render()}
    catch(e){toast(errMsg(e.code||'bad_image'));break}
  }
  toast(t('saved'));
}
const winText=c=>tf('winback',{n:(c.name||'').split(' ')[0],b:tx(A.biz.name),l:SITE+'/b/'+A.biz.slug});
const waLink=(phone,text)=>`https://wa.me/972${phone.replace(/^0/,'')}${text?'?text='+encodeURIComponent(text):''}`;
let saveTimer=null;
function saveConfig(now){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{const {name,services,staff,hours,cutoff,blocked,products,club,address,phone,theme,social,tagline}=A.biz;
      const r=await api('PUT',`/admin/${A.biz.slug}/config`,{name,services,staff,hours,cutoff,blocked,products,club,address:address||'',phone:phone||'',theme,social,tagline},A.pin);
      const keepIcons=r.biz;A.biz=keepIcons;S.biz=keepIcons;toast(t('saved'))}
    catch(e){if(e.code==='bad_pin')return logout();toast(errMsg(e.code))}
  },now?0:900);
}
async function login(pin){
  A.loading=true;A.err='';render();
  try{const r=await api('POST',`/admin/${KEY}/login`,{},pin);A.pin=pin;A.biz=r.biz;A.wa=r.waConnected;S.biz=r.biz;S.today=r.today;store.sset('tl-pin-'+KEY,pin);A.loading=false;loadTab()}
  catch(e){A.loading=false;store.sset('tl-pin-'+KEY,null);A.err=errMsg(e.code);render()}
}
function logout(){store.sset('tl-pin-'+KEY,null);A.biz=null;A.pin=null;A.cache={};A.clients=null;A.orders=null;render()}
function copyText(txt){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('copied'))}catch(e){}ta.remove()};
  try{navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),fb)}catch(e){fb()}
}
const nextIcon=cur=>ICONS[(ICONS.indexOf(cur)+1)%ICONS.length];

/* ===================== events ===================== */
document.addEventListener('click',async e=>{
  const el=e.target.closest('button');if(!el)return;
  const d=el.dataset;
  if(d.l){lang=d.l;store.set('tl-lang',lang);render();return}
  if(d.gal){const im=el.querySelector('img');if(im&&im.src)lightbox(im.src);return}
  if(d.star){mg.stars=+d.star;mg.revText=(document.getElementById('revText')||{}).value||mg.revText||'';render();return}
  if(d.a==='sendReview'){
    mg.revText=document.getElementById('revText').value;el.disabled=true;
    try{await api('POST',`/booking/${KEY}/review`,{stars:mg.stars,text:mg.revText});mg.reviewed=true;mg.data.canReview=false}catch(err){mg.err=errMsg(err.code)}
    render();return}
  if(d.view){S.view=d.view;if(d.view==='shop'&&shop.order){shop.order=null;shop.step='list'}render();window.scrollTo(0,0);return}
  // booking
  if(d.svc){cb.serviceId=d.svc;if(single()){cb.staffId=S.biz.staff[0].id;cb.step=2;const au=!cb.date;cb.date=cb.date||firstOpen();loadSlots(au?1:0)}else{cb.step=1;render()}return}
  if(d.stf){cb.staffId=d.stf;cb.step=2;const au=!cb.date;cb.date=cb.date||firstOpen();loadSlots(au?1:0);return}
  if(d.date){cb.date=d.date;loadSlots();return}
  if(d.time){cb.time=d.time;cb.staffId=d.sid;cb.step=3;cb.err='';render();window.scrollTo(0,0);return}
  if(d.a==='back'){
    if(cb.resched&&cb.step===2){cb=null;render();return}
    cb.err='';if(cb.step===3){cb.step=2;loadSlots();return}
    cb.step=cb.step===2&&!single()?1:0;render();return}
  if(d.a==='book'){submitBooking();return}
  // manage
  if(d.a==='resched'){const b=mg.data.booking;cb={...freshCb(),resched:b.id,serviceId:b.serviceId,staffId:b.staffId,date:b.date,step:2};loadSlots();return}
  if(d.a==='cancelMine'){
    if(!mg.confirm){mg.confirm=true;render();return}
    el.disabled=true;
    try{const r=await api('POST',`/booking/${KEY}/cancel`);mg.data.booking=r.booking;mg.msg=r.message}catch(err){mg.err=errMsg(err.code,S.biz.cutoff)}
    mg.confirm=false;render();return}
  // shop
  if(d.q){const p=S.biz.products.find(x=>x.id===d.pid);const q=Math.max(0,Math.min(p.stock,(shop.cart[d.pid]||0)+ +d.q));shop.cart[d.pid]=q;render();return}
  if(d.a==='checkout'){shop.step='checkout';shop.name=shop.name||store.get('tl-name')||'';shop.phone=shop.phone||store.get('tl-phone')||'';render();window.scrollTo(0,0);return}
  if(d.a==='shopBack'){shop.step='list';render();return}
  if(d.a==='placeOrder'){placeOrder();return}
  if(d.a==='shopAgain'){shop.order=null;shop.step='list';render();return}
  // admin
  if(d.a==='login'){const v=document.getElementById('pinIn').value.trim();if(v)login(v);return}
  if(d.a==='logout'){logout();return}
  if(d.tab){A.tab=d.tab;A.confirm=null;A.client=null;loadTab();window.scrollTo(0,0);return}
  if(d.adate){A.date=d.adate;render();return}
  if(d.a==='refresh'){A.cache={};loadTab(true);return}
  if(d.period){A.period=d.period;loadTab();return}
  if(d.filter){A.filter=d.filter;render();return}
  if(d.client){A.client=d.client;if(A.tab!=='clients'){A.tab='clients';if(!A.clients)await loadClients();tabData=[]}render();window.scrollTo(0,0);return}
  if(d.a==='clientsBack'){A.client=null;render();return}
  if(d.tag){const c=clientOf(d.cphone);const tags=new Set(c.tags||[]);tags.has(d.tag)?tags.delete(d.tag):tags.add(d.tag);c.tags=[...tags];render();updClient(d.cphone,{tags:c.tags});return}
  if(d.redeem){updClient(d.redeem,{redeem:true});return}
  if(d.st){
    if(d.st==='cancelled'&&A.confirm!=='c'+d.id){A.confirm='c'+d.id;render();return}
    A.confirm=null;
    const b=tabData.find(x=>x.id===d.id);const prev=b.status;b.status=d.st;render();
    try{await api('POST',`/admin/${A.biz.slug}/status`,{date:d.d,id:d.id,status:d.st},A.pin);loadClients().then(render)}catch(err){b.status=prev;render();toast(errMsg(err.code))}
    return}
  if(d.ssub){A.storeSub=d.ssub;render();return}
  if(d.ost){
    if(d.ost==='cancelled'&&A.confirm!=='o'+d.oid){A.confirm='o'+d.oid;render();return}
    A.confirm=null;
    try{const r=await api('POST',`/admin/${A.biz.slug}/order-status`,{id:d.oid,status:d.ost},A.pin);const o=A.orders.find(x=>x.id===d.oid);Object.assign(o,r.order);
      const fresh=await api('POST',`/admin/${A.biz.slug}/login`,{},A.pin);A.biz.products=fresh.biz.products;render()}catch(err){toast(errMsg(err.code))}
    return}
  if(d.picon){const p=A.biz.products.find(x=>x.id===d.picon);p.icon=nextIcon(p.icon);render();saveConfig();return}
  if(d.sicon){const s=A.biz.services.find(x=>x.id===d.sicon);s.icon=nextIcon(s.icon);render();saveConfig();return}
  if(d.bicon){A.biz.icon=nextIcon(A.biz.icon);render();saveConfig();return}
  if(d.delp){A.biz.products=A.biz.products.filter(x=>x.id!==d.delp);render();saveConfig();return}
  if(d.a==='addProd'){A.biz.products.push({id:rid(),name:{he:'',ar:''},desc:{he:'',ar:''},price:50,stock:10,icon:'package',active:true});render();saveConfig();return}
  if(d.set){A.set=d.set;render();return}
  if(d.color){A.biz.theme.accent=d.color;render();saveConfig();return}
  if(d.mode){A.biz.theme.mode=d.mode;render();saveConfig(true);return}
  if(d.lbg!==undefined){A.biz.theme.logoBg=d.lbg;render();saveConfig(true);return}
  if(d.a==='rmLogo'){try{const r=await api('PUT',`/admin/${A.biz.slug}/logo`,{src:''},A.pin);A.biz=r.biz;A.swatches=null;render()}catch(err){toast(errMsg(err.code))}return}
  if(d.gdel){try{const r=await api('POST',`/admin/${A.biz.slug}/gallery-del`,{id:d.gdel},A.pin);A.biz=r.biz;render()}catch(err){toast(errMsg(err.code))}return}
  if(d.a==='copyReport'){copyText(reportText());return}
  if(d.a==='copyLink'){copyText(SITE+'/b/'+A.biz.slug);return}
  if(d.a==='test'){
    const ph=document.getElementById('testPhone').value.replace(/\D/g,'');
    if(!/^05\d{8}$/.test(ph)){toast(errMsg('bad_phone'));return}
    store.set('tl-test',ph);el.disabled=true;
    try{const r=await api('POST',`/admin/${A.biz.slug}/test-message`,{phone:ph,lang},A.pin);toast(t('m_'+r.message.status));loadTab()}catch(err){toast(errMsg(err.code));el.disabled=false}
    return}
  if(d.a==='addSv'){A.biz.services.push({id:rid(),name:{he:'',ar:''},dur:30,price:50,icon:'scissors'});render();saveConfig();return}
  if(d.delsv){if(A.biz.services.length>1){A.biz.services=A.biz.services.filter(x=>x.id!==d.delsv);render();saveConfig()}return}
  if(d.a==='addSf'){A.biz.staff.push({id:rid(),name:{he:'',ar:''}});render();saveConfig();return}
  if(d.delsf){if(!single()){A.biz.staff=A.biz.staff.filter(x=>x.id!==d.delsf);render();saveConfig()}return}
  if(d.blk){A.biz.blocked=A.biz.blocked.includes(d.blk)?A.biz.blocked.filter(p=>p!==d.blk):[...A.biz.blocked,d.blk];render();saveConfig(true);return}
  if(d.a==='savePin'){
    const v=document.getElementById('newPin').value.trim();
    if(!/^\d{4,8}$/.test(v)){toast(errMsg('bad_pin'));return}
    try{await api('PUT',`/admin/${A.biz.slug}/config`,{pin:v},A.pin);A.pin=v;store.sset('tl-pin-'+KEY,v);toast(t('saved'));document.getElementById('newPin').value=''}catch(err){toast(errMsg(err.code))}
    return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pinIn'){const v=e.target.value.trim();if(v)login(v)}});
document.addEventListener('input',e=>{
  const el=e.target,d=el.dataset;
  if(el.id==='fName'){cb.name=el.value;return}
  if(el.id==='fPhone'){cb.phone=el.value;return}
  if(el.id==='sName'){shop.name=el.value;return}
  if(el.id==='sPhone'){shop.phone=el.value;return}
  if(el.id==='sNote'){shop.note=el.value;return}
  if(!A.biz)return;
  if(el.id==='cSearch'){A.q=el.value;document.getElementById('clist').innerHTML=clientRows(A.clients.map(c=>({c,a:analyze(c)})));return}
  if(d.sv){const x=A.biz.services.find(s=>s.id===d.sv);if(!x)return;if(d.f==='he'||d.f==='ar')x.name[d.f]=el.value;else x[d.f]=Math.max(0,+el.value||0);saveConfig();return}
  if(d.sf){const p=A.biz.staff.find(s=>s.id===d.sf);if(p){p.name[d.f]=el.value;saveConfig()}return}
  if(d.pp&&d.f!=='active'){const p=A.biz.products.find(s=>s.id===d.pp);if(!p)return;
    if(d.f==='he'||d.f==='ar')p.name[d.f]=el.value;else if(d.f==='dhe')p.desc.he=el.value;else if(d.f==='dar')p.desc.ar=el.value;else p[d.f]=Math.max(0,+el.value||0);saveConfig();return}
  if(d.biz){A.biz.name[d.biz]=el.value;saveConfig();return}
  if(d.bf){A.biz[d.bf]=el.value;saveConfig();return}
  if(d.club){A.biz.club.reward[d.club]=el.value;saveConfig();return}
  if(d.tag2){A.biz.tagline[d.tag2]=el.value;saveConfig();return}
  if(d.soc){A.biz.social[d.soc]=el.value.trim();saveConfig();return}
  if(el.id==='colorPick'){A.biz.theme.accent=el.value;applyTheme(A.biz.theme);saveConfig();return}
  if(el.id==='clubEvery'){A.biz.club.rewardEvery=Math.max(2,Math.min(50,+el.value||10));saveConfig();return}
});
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;if(!A.biz)return;
  if(d.hr!=null){const h=A.biz.hours[+d.hr];if(d.f==='open')h.open=el.checked;else h[d.f]=el.value;render();saveConfig();return}
  if(d.pp&&d.f==='active'){const p=A.biz.products.find(s=>s.id===d.pp);p.active=el.checked;saveConfig(true);return}
  if(el.id==='cutSel'){A.biz.cutoff=+el.value;saveConfig(true);return}
  if(el.id==='clubOn'){A.biz.club.enabled=el.checked;render();saveConfig(true);return}
  if(el.id==='clubEvery'){render();return}
  if(el.id==='logoFile'&&el.files[0]){uploadLogo(el.files[0]);return}
  if(el.id==='galFile'&&el.files.length){uploadGallery(el.files);return}
  if(el.id==='colorPick'){render();return}
  if(d.reply){api('POST',`/admin/${A.biz.slug}/review-reply`,{id:d.reply,reply:el.value},A.pin).then(()=>toast(t('saved')),err=>toast(errMsg(err.code)));return}
  if(el.id==='cNotes'){updClient(d.cphone,{notes:el.value});return}
  if(el.id==='cBday'){const v=el.value.trim();if(v&&!/^\d{2}-\d{2}$/.test(v)){toast('DD-MM');return}updClient(d.cphone,{birthday:v});return}
});

/* ===================== boot ===================== */
if(PREVIEW){
  const nav=document.createElement('div');nav.className='seg';nav.id='pvNav';
  document.querySelector('.top .sp').after(nav);
  const paintNav=()=>{nav.innerHTML=`<a href="#b-demo" class="${MODE!=='admin'?'on':''}">${lang==='ar'?'الزبون':'לקוח'}</a><a href="#admin-demo" class="${MODE==='admin'?'on':''}">${lang==='ar'?'الإدارة':'ניהול'}</a>`};
  const _render=render;render=function(){_render();paintNav()};
  window.addEventListener('hashchange',()=>{P=parseRoute();setMode();resetState();window.scrollTo(0,0);boot()});
}
async function boot(){
  render();
  try{
    if(MODE==='admin'){const p=store.sget('tl-pin-'+KEY);if(p)login(p);else render();return}
    if(MODE==='manage'){
      const r=await api('GET','/booking/'+encodeURIComponent(KEY));
      S.biz=r.biz;S.today=r.today;mg.data=r;
    }else{
      const r=await api('GET','/biz/'+encodeURIComponent(KEY));
      S.biz=r.biz;S.today=r.today;cb=freshCb();
      api('GET','/extras/'+encodeURIComponent(KEY)).then(x=>{S.reviews=x.reviews;if(cb&&cb.step===0&&!cb.done)render()}).catch(()=>{});
    }
    if(!PREVIEW&&S.biz){
      // "install as app" with the business' own name, colors and logo
      const add=(rel,href)=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l)};
      add('manifest','/api/manifest/'+S.biz.slug);
      if(S.biz.logoV){add('icon','/api/img/'+S.biz.slug+'/logo?v='+S.biz.logoV);add('apple-touch-icon','/api/img/'+S.biz.slug+'/logo?v='+S.biz.logoV)}
    }
  }catch(e){S.loadErr=e.code}
  render();
}
boot();
</script>
