<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>TorLink</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Cairo:wght@400;600;700&family=Suez+One&family=Reem+Kufi:wght@600;700&family=Frank+Ruhl+Libre:wght@500;700;900&family=Amiri:wght@400;700&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0e0e10;--bg2:#141417;--card:#1a1a1e;--card2:#212126;--line:#2b2b32;--line2:#383841;
  --ink:#f4efe6;--muted:#9a948a;--dim:#6d685f;
  --gold:#c9a45c;--gold2:#e8cb8a;--gold-soft:rgba(201,164,92,.12);--gold-line:rgba(201,164,92,.35);
  --red:#cf4a3f;--ok:#4cb37d;--warn:#e0a83e;--blue:#5b8def;--wa:#25d366;
  --r:18px;--display:'Suez One','Reem Kufi',serif;--dw:400;
  --scene:radial-gradient(ellipse at 50% 35%,rgba(255,214,150,.22),transparent 62%),radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.55),transparent 60%),repeating-linear-gradient(92deg,rgba(0,0,0,.08) 0 2px,transparent 2px 11px,rgba(255,255,255,.03) 11px 13px,transparent 13px 23px),linear-gradient(180deg,#6a4327,#4b2d18);
  --wall:radial-gradient(ellipse at 50% -10%,rgba(255,226,170,.35),transparent 55%),radial-gradient(ellipse at 15% 30%,rgba(255,210,150,.12),transparent 40%),radial-gradient(ellipse at 85% 30%,rgba(255,210,150,.12),transparent 40%),linear-gradient(180deg,#2c1d13,#1a110b);
  --plank:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 14px),linear-gradient(180deg,#8a5d3a,#5e3c22);--plank-top:linear-gradient(180deg,#5a3a22,#7b5233);
  --sign-bg:linear-gradient(180deg,#3b2718,#24170e);--sign-ink:#f3d79c;
  --sheet:radial-gradient(ellipse at 50% 18%,color-mix(in srgb,var(--gold) 26%,transparent),transparent 58%),linear-gradient(180deg,#1f150d,#0f0a06 70%);--sv-ink:#f4e6cc;--sv-head:#fff7e6;--sv-muted:rgba(244,230,204,.65);--sv-glass:rgba(255,255,255,.07);
  --cover:radial-gradient(circle at 30% 20%,rgba(255,255,255,.12),transparent 50%),linear-gradient(140deg,color-mix(in srgb,var(--gold) 55%,#2a170b),#1a0f08);--cover-ink:#f6e7c8;--paper:#fbf6ec;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:'Heebo','Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(900px 420px at 85% -10%,var(--glow),transparent 60%),radial-gradient(700px 400px at 0% 0%,var(--glow2),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.ic{width:18px;height:18px;stroke-width:1.8;flex:none;vertical-align:middle}
.ic.sm{width:15px;height:15px}.ic.lg{width:24px;height:24px}.ic.xl{width:30px;height:30px}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(14,14,16,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.3px}
.brand .mk{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1408}
.brand b{color:var(--gold)}
.sp{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button,.seg a{background:none;border:0;color:var(--muted);padding:6px 11px;border-radius:9px;font-size:13px;font-weight:600;text-decoration:none}
.seg .on{background:var(--gold);color:var(--on)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 90px}
/* hero */
.hero{position:relative;margin:16px 0 18px;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(600px 220px at 100% 0%,var(--gold-soft),transparent 70%),linear-gradient(160deg,var(--card2),var(--bg2) 60%)}
.hero .pole{height:8px;background:repeating-linear-gradient(-45deg,#c0453b 0 12px,#f4efe6 12px 24px,#28406e 24px 36px,#f4efe6 36px 48px);opacity:.85}
.hero .pole.accent{background:repeating-linear-gradient(-45deg,var(--gold) 0 12px,var(--gold2) 12px 24px,var(--gold-soft) 24px 36px,var(--gold2) 36px 48px);opacity:.9}
.hero-in{padding:22px 20px 20px;display:flex;gap:16px;align-items:center}
.logo{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--gold2);
  background:radial-gradient(circle at 30% 25%,var(--card2),var(--bg2));border:2px solid var(--gold-line);box-shadow:0 0 0 6px var(--gold-soft),0 10px 30px rgba(0,0,0,.35);overflow:hidden}
.logo .ic{width:34px;height:34px}
.hero h1{margin:0;font-family:var(--display);font-weight:var(--dw);font-size:28px;line-height:1.15;letter-spacing:.3px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;color:var(--muted);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(76,179,125,.18)}
.dot.off{background:var(--red);box-shadow:0 0 0 3px rgba(207,74,63,.18)}
/* nav pills */
.nav{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.nav button{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav .cnt{background:var(--gold);color:var(--on);border-radius:999px;font-size:11px;padding:0 7px;font-weight:800}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card.flat{background:var(--bg2)}
h2{font-family:var(--display);font-weight:var(--dw);font-size:21px;margin:0 0 14px;letter-spacing:.2px}
h3{font-size:14px;margin:18px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.sub{color:var(--muted);font-size:13px;margin:-8px 0 14px}
.list{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:.15s}
.opt:hover{border-color:var(--gold-line);transform:translateY(-1px)}
.opt .n{font-weight:700;font-size:15px}.opt .m{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px;margin-top:2px}
.opt .pr{margin-inline-start:auto;font-weight:800;color:var(--gold2);white-space:nowrap;font-size:16px}
.tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--gold2);background:linear-gradient(145deg,rgba(201,164,92,.18),rgba(201,164,92,.04));border:1px solid var(--gold-line)}
.tile .ic{width:22px;height:22px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:var(--card2);border:2px solid var(--line2);color:var(--ink);font-size:16px}
.av.vip{border-color:var(--gold);color:var(--gold2)}.av.gold{border-color:#d8b46a}.av.silver{border-color:#b9bcc4}
.steps{display:flex;gap:6px;margin:0 0 16px}.steps i{flex:1;height:3px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:9px 10px;min-width:64px;text-align:center;color:var(--ink)}
.chip b{display:block;font-size:19px;font-weight:800}.chip small{color:var(--muted);font-size:11px}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--on)}.chip.on small{color:var(--on);opacity:.7}
.chip:disabled{opacity:.35;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:14px}
.slot{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 0;font-weight:700;direction:ltr;color:var(--ink)}
.slot:hover{border-color:var(--gold);color:var(--gold2)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.pill.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold2)}
.empty{color:var(--muted);text-align:center;padding:26px 6px}
.empty .ic{width:34px;height:34px;color:var(--dim);display:block;margin:0 auto 8px}
label.f{display:block;margin-bottom:12px}label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
input[type=text],input[type=tel],input[type=number],input[type=time],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--line2);border-radius:12px;padding:11px 13px;background:var(--bg2);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
input::placeholder,textarea::placeholder{color:var(--dim)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 24px var(--gold-soft)}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.dark{background:var(--card2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.danger{background:var(--red);color:#fff;box-shadow:none}
.btn.okb{background:var(--ok);color:#06180e;box-shadow:none}
.btn.wa{background:var(--wa);color:#05210f;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.back{background:none;border:0;color:var(--muted);padding:0;margin-bottom:12px;font-size:14px;display:inline-flex;gap:4px;align-items:center}
.sum{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;gap:10px}.sum div span:first-child{color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.sum .old{text-decoration:line-through;color:var(--dim)}
.okc{width:76px;height:76px;border-radius:50%;margin:4px auto 12px;display:grid;place-items:center;color:var(--on);background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 0 0 10px var(--gold-soft)}
.okc.x{background:var(--card2);color:var(--muted);box-shadow:none}
.okc .ic{width:36px;height:36px;stroke-width:2.4}
.center{text-align:center}
.wa-box{background:#0f1f16;border:1px solid #1d3b2a;border-radius:16px;padding:12px;margin-top:14px}
.wa-box .lbl{font-size:12px;color:#7fd8a4;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.bub{background:#1d2b23;color:#e8f3ec;border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:14px;white-space:pre-line;word-break:break-word}
.err{color:#ff8a7e;font-size:13px;margin:8px 0}
.info-box{background:rgba(224,168,62,.08);border:1px solid rgba(224,168,62,.3);border-radius:14px;padding:11px 13px;font-size:13px;color:#f0c97a;margin-bottom:14px;display:flex;gap:8px}
.ok-box{background:rgba(76,179,125,.08);border:1px solid rgba(76,179,125,.3);border-radius:14px;padding:11px 13px;font-size:13px;color:#8fe0b4;margin-bottom:14px;display:flex;gap:8px}
/* club card */
/* ---- wallet card (/c/<token>) ---- */
.wal{max-width:440px;margin:6px auto 0}
.wc{position:relative;border-radius:26px;padding:22px 22px 18px;overflow:hidden;color:#f8f1e2;border:1px solid var(--gold-line);min-height:220px;
  background:radial-gradient(420px 220px at 110% -10%,var(--club-glow),transparent 60%),linear-gradient(140deg,var(--club1),#0d0c0e 78%);
  box-shadow:0 30px 60px -28px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);transform-style:preserve-3d;animation:wcIn .7s cubic-bezier(.2,.8,.2,1) both}
.wc:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.13) 45%,transparent 60%);transform:translateX(-120%);animation:wcShine 2.6s 1s ease-in-out both;pointer-events:none}
.wc:after{content:"";position:absolute;inset:auto -50px -80px auto;width:230px;height:230px;border-radius:50%;border:34px solid rgba(255,255,255,.04)}
@keyframes wcIn{from{opacity:0;transform:perspective(900px) rotateX(18deg) translateY(24px)}to{opacity:1;transform:none}}
@keyframes wcShine{to{transform:translateX(120%)}}
.wc .top1{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.wc .logo{width:46px;height:46px;border-radius:14px;flex:none}
.wc .bn{font-family:var(--display);font-weight:var(--dw);font-size:19px;line-height:1.15}
.wc .sub{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--club-ink);font-weight:800}
.wc .bal{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:26px;position:relative;z-index:1}
.wc .big{font-family:var(--display);font-size:54px;line-height:.9;color:#fff}.wc .big small{font-size:20px;opacity:.6}
.wc .lbl{font-size:12px;color:#d9ccb0;margin-top:6px}
.wc .who{text-align:end;font-size:13px;color:#e9dfc9}.wc .who b{display:block;font-size:16px;color:#fff}
.wc .meter{height:7px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:16px;overflow:hidden;position:relative;z-index:1}
.wc .meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--club-ink),#fff);transform-origin:right;animation:wcBar 1.1s .4s cubic-bezier(.2,.8,.2,1) both}
html[dir=ltr] .wc .meter i{transform-origin:left}
@keyframes wcBar{from{transform:scaleX(0)}}
.wqr{display:flex;gap:14px;align-items:center;margin-top:14px}
.wqr .q{width:112px;height:112px;flex:none;background:#fff;border-radius:16px;padding:6px;box-shadow:0 10px 24px -14px rgba(0,0,0,.6)}.wqr .q svg{width:100%;height:100%;display:block;border-radius:10px}
.wnext{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.wnext .d{width:54px;height:58px;border-radius:14px;background:var(--gold-soft);border:1px solid var(--gold-line);display:grid;place-items:center;text-align:center;line-height:1.05;flex:none}
.wnext .d b{font-family:var(--display);font-size:22px;color:var(--gold2)}.wnext .d span{font-size:11px;color:var(--muted)}
.wpk{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.wpk.off{opacity:.55}
.wpk .tr{height:6px;border-radius:6px;background:var(--line);margin:8px 0 4px;overflow:hidden}.wpk .tr i{display:block;height:100%;background:var(--gold)}
.pk-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.gwb{background:#000!important;color:#fff!important;border:1px solid #444!important}
.home-tip{font-size:13px;color:var(--muted);line-height:1.6}
.club{position:relative;border-radius:22px;padding:20px;overflow:hidden;color:#f8f1e2;border:1px solid var(--gold-line);
  background:radial-gradient(500px 200px at 100% 0%,var(--club-glow),transparent 60%),linear-gradient(135deg,var(--club1),#111012 70%)}
.club:after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;border-radius:50%;border:30px solid rgba(255,255,255,.04)}
.club .tier{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--club-ink)}
.club .nm{font-family:var(--display);font-size:24px;margin:6px 0 2px}
.club .punch{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px}
.club .punch i{width:26px;height:26px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.3);display:grid;place-items:center}
.club .punch i.on{background:var(--club-ink);border:0;color:#141210}
.club .punch i.gift{border-style:solid;border-color:var(--club-ink);color:var(--club-ink)}
.club .hint{font-size:13px;color:#d9ccb0}
/* shop */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.prod .pic{height:96px;border-radius:14px;display:grid;place-items:center;color:var(--gold2);background:radial-gradient(circle at 50% 40%,rgba(201,164,92,.22),rgba(201,164,92,.03) 70%),var(--bg2);border:1px solid var(--line)}
.prod .pic .ic{width:40px;height:40px;stroke-width:1.5}
.prod .n{font-weight:700;line-height:1.3}.prod .d{color:var(--muted);font-size:12px;min-height:32px}
.prod .pr{font-weight:800;color:var(--gold2);font-size:17px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);display:grid;place-items:center}
.qty b{min-width:20px;text-align:center}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));width:min(788px,calc(100% - 32px));z-index:15}
.cartbar .btn{width:100%;justify-content:space-between;padding:15px 20px;font-size:15px}
/* admin */
.ahead{display:flex;align-items:center;gap:14px;margin:16px 0}
.ahead .logo{width:52px;height:52px}.ahead .logo .ic{width:24px;height:24px}
.ahead h1{font-family:var(--display);font-weight:var(--dw);font-size:22px;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none;position:sticky;top:57px;z-index:10;background:linear-gradient(var(--bg) 70%,transparent);padding-top:6px}
.tabs button{flex:none;display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:9px 13px;font-size:13px;font-weight:700}
.tabs button.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold2)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpis.k3{grid-template-columns:repeat(3,1fr)}.kpis.k2{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600}
.kpi b{display:block;font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.3px}
.kpi.hl{background:linear-gradient(135deg,var(--gold-soft),transparent),var(--card);border-color:var(--gold-line)}.kpi.hl b{color:var(--gold2)}
.kpi .ic{color:var(--gold)}
.bk{display:flex;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:var(--card2);position:relative}
.bk:before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--gold)}
.bk.arrived:before{background:var(--ok)}.bk.noshow:before{background:var(--red)}.bk.cancelled{opacity:.5}.bk.cancelled:before{background:var(--dim)}
.bk .tm{font-weight:800;direction:ltr;min-width:50px;font-size:16px}.bk .tm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.bk .info{flex:1;min-width:0}.bk .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lnk{background:none;border:0;padding:0;color:var(--ink);font-weight:700;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold2);font-weight:700;white-space:nowrap}

body[data-skin=blush] .sp-floor,body[data-skin=fresh] .sp-floor{background:radial-gradient(ellipse,rgba(0,0,0,.22),transparent 70%)}

body[data-skin=blush] .b3-emb h2,body[data-skin=fresh] .b3-emb h2{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.18)}
body[data-skin=blush] .b3-kick,body[data-skin=fresh] .b3-kick{color:#fff;border-color:rgba(255,255,255,.6)}
body[data-skin=blush] .b3-logo,body[data-skin=fresh] .b3-logo{box-shadow:0 0 0 2px rgba(255,255,255,.7);background:rgba(255,255,255,.25)}
body[data-skin=luxe] .b3-emb{border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:6px}
.skin-card{border:1.5px solid var(--line);background:var(--card2);border-radius:16px;padding:8px;text-align:start;display:flex;flex-direction:column;gap:6px;transition:.2s}
.skin-card.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.sk-pv{height:64px;border-radius:11px;background:var(--pbg);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:7px;gap:6px;border:1px solid rgba(0,0,0,.06)}
.sk-pv i{position:absolute;top:8px;inset-inline-start:8px;width:44%;height:20px;border-radius:7px;background:var(--pcard);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sk-pv b{font-family:var(--pfont);font-weight:700;font-size:20px;color:var(--pink)}
.sk-pv em{margin-inline-start:auto;width:26px;height:26px;border-radius:50%;background:var(--pacc)}
.sk-n{font-size:12.5px;font-weight:700;line-height:1.3}.sk-n small{display:block;color:var(--muted);font-weight:500}
body.light{--bg:#f6f4f0;--bg2:#efebe5;--card:#ffffff;--card2:#faf8f4;--line:#e7e1d7;--line2:#d6cfc3;--ink:#1c1a17;--muted:#6e685e;--dim:#a39c90}
body.light .top{background:rgba(255,255,255,.85)}
body.light .wa-box{background:#ebf8f0;border-color:#cdebd8}body.light .wa-box .lbl{color:#1d8248}body.light .bub{background:#fff;color:#1c1a17}
body.light .info-box{color:#8a5a00}body.light .ok-box{color:#1d7a45}body.light .err{color:#c0392b}
body.light .badge{filter:brightness(.6) saturate(1.3)}
body.light .opt:hover,body.light .card{box-shadow:0 1px 2px rgba(0,0,0,.04)}
@media (max-width:620px){
  .kpis{grid-template-columns:repeat(2,1fr)}.stgrid{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:24px}.logo{width:62px;height:62px}
  .ed{grid-template-columns:40px 1fr 1fr 54px 50px 24px}
}
@media (max-width:380px){.grid{grid-template-columns:1fr}}

/* ===================== QR (byte mode, ECC M, v1–6) → SVG ===================== */
function qrMatrix(text){
  const EC={1:[16,10,1],2:[28,16,1],3:[44,26,1],4:[64,18,2],5:[86,24,2],6:[108,16,4]},AL={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34]};
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>7)*0x11D);z^=((y>>i)&1)*x}return z&255};

  if(v>6)return null;
  const bits=[0,1,0,0];for(let i=7;i>=0;i--)bits.push((data.length>>i)&1);
  data.forEach(b=>{for(let i=7;i>=0;i--)bits.push((b>>i)&1)});
  for(let k=Math.min(4,cap*8-bits.length);k>0;k--)bits.push(0);while(bits.length%8)bits.push(0);
  const cw=[];for(let i=0;i<bits.length;i+=8)cw.push(parseInt(bits.slice(i,i+8).join(''),2));
  for(let k=0;cw.length<cap;k++)cw.push(k%2?0x11:0xEC);
  const div=[];{const r=Array(ecl-1).fill(0).concat([1]);let root=1;for(let n=0;n<ecl;n++){for(let j=0;j<ecl;j++){r[j]=mul(r[j],root);if(j+1<ecl)r[j]^=r[j+1]}root=mul(root,2)}div.push(...r)}
  const rem=d=>{const res=Array(ecl).fill(0);d.forEach(b=>{const f=b^res.shift();res.push(0);div.forEach((c,i)=>res[i]^=mul(c,f))});return res};
  const bl=cap/blocks,db=[],eb=[];for(let i=0;i<blocks;i++){db.push(cw.slice(i*bl,(i+1)*bl));eb.push(rem(db[i]))}
  const fin=[];for(let i=0;i<bl;i++)db.forEach(b=>fin.push(b[i]));for(let i=0;i<ecl;i++)eb.forEach(e=>fin.push(e[i]));
  const n=v*4+17,M=[...Array(n)].map(()=>Array(n).fill(0)),F=[...Array(n)].map(()=>Array(n).fill(false));
  const sf=(x,y,d)=>{M[y][x]=d?1:0;F[y][x]=true};
  for(let i=0;i<n;i++){sf(6,i,i%2==0);sf(i,6,i%2==0)}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy;if(x>=0&&x<n&&y>=0&&y<n){const d=Math.max(Math.abs(dx),Math.abs(dy));sf(x,y,d!==2&&d!==4)}}};
  finder(3,3);finder(n-4,3);finder(3,n-4);
  const al=AL[v];al.forEach((a,i)=>al.forEach((b,j)=>{if((i==0&&j==0)||(i==0&&j==al.length-1)||(i==al.length-1&&j==0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)sf(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}));
  const fmt=m=>{let r=m;for(let k=0;k<10;k++)r=(r<<1)^((r>>9)*0x537);const b=((m<<10)|r)^0x5412,g=i=>(b>>i)&1;
    for(let i=0;i<6;i++)sf(8,i,g(i));sf(8,7,g(6));sf(8,8,g(7));sf(7,8,g(8));for(let i=9;i<15;i++)sf(14-i,8,g(i));
    for(let i=0;i<8;i++)sf(n-1-i,8,g(i));for(let i=8;i<15;i++)sf(8,n-15+i,g(i));sf(8,n-8,1)};
  fmt(0);
  let i=0;for(let right=n-1;right>=1;right-=2){if(right==6)right=5;for(let vert=0;vert<n;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)==0,y=up?n-1-vert:vert;if(!F[y][x]&&i<fin.length*8){M[y][x]=(fin[i>>3]>>(7-(i&7)))&1;i++}}}
  const MK=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2==0,(x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
  const ap=m=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!F[y][x]&&MK[m](x,y))M[y][x]^=1};
  const pen=()=>{let p=0;for(const T of [M,M[0].map((_,c)=>M.map(r=>r[c]))])for(const r of T){let run=1;for(let k=1;k<n;k++){if(r[k]===r[k-1])run++;else{if(run>=5)p+=run-2;run=1}}if(run>=5)p+=run-2}

function qrSvg(text,fg='#111',bg='#fff'){

}

async function loadSlots(auto){
  const date=cb.date;cb.slots=null;cb.err='';render();
  const q=new URLSearchParams({slug:S.biz.slug,date,staff:cb.staffId||'any'});
  if(cb.resched)q.set('ignore',cb.resched);else q.set('service',cb.serviceId);
  try{
    const r=await api('GET','/slots?'+q);
    if(cb.date!==date)return;
    // date was chosen for the customer and is full → jump to the next open day with free times
    if(auto&&!r.slots.length&&auto<10){
      let k=date;for(let i=0;i<14;i++){k=addDaysK(k,1);if(openOn(k))break}
      if(dayNo(k)-dayNo(S.today)<21){cb.date=k;return loadSlots(auto+1)}
    }
    cb.slots=r.slots;render();
    if(auto){const ch=document.querySelector('.chip.on');if(ch)ch.scrollIntoView({inline:'center',block:'nearest'})}
  }
  catch(e){cb.slots=[];cb.err=errMsg(e.code);render()}
}
const firstOpen=()=>{for(let i=0;i<21;i++){const k=addDaysK(S.today,i);if(openOn(k))return k}return S.today};
async function submitBooking(){
  cb.err='';
  try{
    cb.busy=true;render();
    if(cb.resched){
      cb.done=await api('POST',`/booking/${cb.resched}/reschedule`,{date:cb.date,time:cb.time,staffId:cb.staffId});
    }else{
      const name=cb.name.trim(),phone=cb.phone.replace(/\D/g,'');
      if(!name)throw {code:'bad_name'};
      if(!/^05\d{8}$/.test(phone))throw {code:'bad_phone'};
      store.set('tl-name',name);store.set('tl-phone',cb.phone);
      cb.done=await api('POST','/book',{slug:S.biz.slug,serviceId:cb.serviceId,staffId:cb.staffId,date:cb.date,time:cb.time,name,phone,lang});
    }
    window.scrollTo(0,0);
  }catch(e){
    if(e.code==='taken'){cb.step=2;cb.err=errMsg('taken');loadSlots()}
    else cb.err=errMsg(e.code,S.biz.cutoff);
  }
  cb.busy=false;render();
}

    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);

    <div class="sp-info" id="spinfo">${spInfo()}</div></div>`;

  st.addEventListener('pointermove',e=>{if(!SP?.drag)return;const now=performance.now(),k=SP.frames?.9:.75;SP.a=SP.drag.a+(e.clientX-SP.drag.x)*k;
    if(now>lt){SP.v=(e.clientX-lx)*k/(now-lt)}lx=e.clientX;lt=now;draw360()});
  const up=()=>{if(SP?.drag){SP.drag=null;SP.idleAt=performance.now();if(performance.now()-lt>80)SP.v=0}};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);

    if(!SP.drag){

  draw360();SP.raf=requestAnimationFrame(loop);
  if(it.spin){

async function uploadSpin(pid,file){
  // cut ~24 evenly spaced frames from the video, in the browser
  toast(lang==='ar'?'بنقطّع الفيديو لصور…':'חותך את הסרטון לתמונות…');
  const url=URL.createObjectURL(file),v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
  try{
    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej({code:'bad_image'});setTimeout(()=>rej({code:'bad_image'}),15000)});
    const d=v.duration;if(!isFinite(d)||d<1)throw {code:'bad_image'};
    const N=24,M=480,k=Math.min(1,M/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
    const x=c.getContext('2d'),frames=[];
    for(let i=0;i<N;i++){
      await new Promise(r=>{v.onseeked=r;v.currentTime=Math.min(d-.05,d*i/N)});
      x.drawImage(v,0,0,c.width,c.height);
      let q=.8,f=c.toDataURL('image/webp',q);if(!f.startsWith('data:image/webp'))f=c.toDataURL('image/jpeg',q);
      while(f.length>150000&&q>.4){q-=.1;f=c.toDataURL(f.startsWith('data:image/webp')?'image/webp':'image/jpeg',q)}
      frames.push(f);
    }
    const r=await api('PUT',`/admin/${A.biz.slug}/spin`,{id:pid,frames},A.pin);A.biz=r.biz;S.biz=r.biz;render();toast(t('saved'));
  }catch(e){toast(errMsg(e.code||'bad_image'))}
  finally{URL.revokeObjectURL(url)}
}

   </div></div></div>
   <div class="b3-ctrl">${sndBtns()}<button class="btn sm dark" data-bk="1" aria-label="next">${ic('chevron-left','sm')}</button><span id="b3pg">${pgLabel()}</span><button class="btn sm dark" data-bk="-1" aria-label="prev">${ic('chevron-right','sm')}</button></div>

   <div class="b3-card" id="b3card"></div></div>`;
}
const bookCls=()=>BK.leaf===0?'closed':BK.leaf>=BK.leaves?'ended':'';
const pgLabel=()=>BK.leaf===0?(lang==='ar'?'الغلاف':'כריכה'):BK.leaf>=BK.leaves?(lang==='ar'?'النهاية':'סוף'):`${BK.leaf} / ${BK.leaves-1}`;
function stageCss(){
  // closed book (cover only) or the back cover alone are centered; open spreads use the full width
  const shift=BK.leaf===0?'calc(var(--pw)*.5)':BK.leaf>=BK.leaves?'calc(var(--pw)*-.5)':'0px';
  return `transform:translateX(${shift}) scale(${BK.zoom}) rotateX(${BK.rx}deg) rotateZ(${BK.rz}deg)`;
}
function leafCss(i,N){
  const flipped=i<BK.leaf,z=flipped?i*.8:(N-i)*.8;
  return `transform:translateZ(${z}px) rotateY(${flipped?180:0}deg)`;
}
function bookSync(turned){
  const N=BK.leaves;
  document.querySelectorAll('.b3-leaf').forEach(el=>{const i=+el.dataset.leaf;el.style.transform=leafCss(i,N).slice(10);el.classList.toggle('live',i===BK.leaf);el.classList.toggle('prev',i===BK.leaf-1);if(turned&&(i===BK.leaf||i===BK.leaf-1)){el.classList.add('turning');setTimeout(()=>el.classList.remove('turning'),950)}});
  const st=document.getElementById('b3stage');if(st)st.style.transform=stageCss().slice(10);
  const bk=document.getElementById('b3book');if(bk)bk.className='b3-book '+bookCls();
  const pg=document.getElementById('b3pg');if(pg)pg.textContent=pgLabel();
}
function bookTurn(dir){
  const n=Math.max(0,Math.min(BK.leaves,BK.leaf+dir));if(n===BK.leaf)return;
  const from=BK.leaf;bookPick(null);BK.leaf=n;bookSync(true);
  if(from===0)SND.open();else SND.flip();
  const live=document.querySelector('.b3-leaf.live');if(live)live.querySelectorAll('.b3-pop').forEach((_,i)=>SND.pop(i));
  const sec=n>0&&n<BK.leaves?bookSections()[n-1]:null;if(sec)SND.say(sec.title);
}
function bookPick(idx){
  document.querySelectorAll('.b3-pop.sel').forEach(e=>e.classList.remove('sel'));
  const card=document.getElementById('b3card');if(!card)return;
  if(idx==null){BK.sel=null;card.classList.remove('on');return}
  const it=BK.items[idx];if(BK.sel!==idx){SND.lift();sayItem(it)}BK.sel=idx;
  document.querySelectorAll(`.b3-pop[data-pop="${idx}"]`).forEach(e=>e.classList.add('sel'));
  fillCard(card,it,'b:'+idx);
}
// pointer: drag rotates, quick horizontal swipe turns the page, two fingers zoom
(function(){
  const pts=new Map();let start=null,pinch=0,moved=false;
  const sc=()=>document.getElementById('b3scene');
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('#b3scene'))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){start={x:e.clientX,y:e.clientY,t:Date.now(),rx:BK.rx,rz:BK.rz};moved=false}
    if(pts.size===2){const [a,b]=[...pts.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)/BK.zoom}});
  document.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch){const [a,b]=[...pts.values()];BK.zoom=Math.max(.6,Math.min(2,Math.hypot(a.x-b.x,a.y-b.y)/pinch));bookSync();moved=true;return}
    if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
    if(moved){BK.rz=Math.max(-35,Math.min(35,start.rz+dx*.18));BK.rx=Math.max(18,Math.min(66,start.rx-dy*.18));bookSync()}});
  const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(start&&pts.size===0){const dx=e.clientX-start.x,dt=Date.now()-start.t;if(Math.abs(dx)>70&&dt<380&&e.pointerType!=='mouse'){BK.rz=start.rz;BK.rx=start.rx;bookTurn(dx>0?1:-1)}start=null}
    if(pts.size<2)pinch=0};
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
  document.addEventListener('click',e=>{if(moved&&e.target.closest('#b3scene')){e.stopPropagation();e.preventDefault();moved=false}},true);
  document.addEventListener('wheel',e=>{if(!e.target.closest('#b3scene'))return;e.preventDefault();BK.zoom=Math.max(.6,Math.min(2,BK.zoom*(e.deltaY>0?.92:1.08)));bookSync()},{passive:false});
  document.addEventListener('keydown',e=>{if(S?.view!=='cat3d')return;if(e.key==='ArrowLeft')bookTurn(1);if(e.key==='ArrowRight')bookTurn(-1)});
})();

function periodRange(p){
  const td=S.today,y=+td.slice(0,4),m=+td.slice(5,7);
  if(p==='week'){const s=addDaysK(td,-wd(td));return [s,addDaysK(s,6)]}
  const last=(yy,mm)=>new Date(Date.UTC(yy,mm,0)).getUTCDate();
  if(p==='month')return [`${y}-${pad(m)}-01`,`${y}-${pad(m)}-${pad(last(y,m))}`];
  if(p==='last'){const yy=m===1?y-1:y,mm=m===1?12:m-1;return [`${yy}-${pad(mm)}-01`,`${yy}-${pad(mm)}-${pad(last(yy,mm))}`]}
  return [addDaysK(td,-29),td];
}

const tierOf=v=>v>=30?'vip':v>=15?'gold':v>=5?'silver':'member';
function analyze(c){
  const ds=c.visitDates||[];
  let gap=null;
  if(ds.length>=2){let s=0;for(let i=1;i<ds.length;i++)s+=dayNo(ds[i])-dayNo(ds[i-1]);gap=Math.max(1,Math.round(s/(ds.length-1)))}
  const since=c.last?dayNo(S.today)-dayNo(c.last):null;
  let status;
  if(!c.visits)status='fresh';
  else{const g=gap||30;status=since>g*2.5&&since>45?'lost':since>g*1.5&&since>21?'risk':'active'}
  const every=Math.max(2,A.biz.club.rewardEvery),earned=Math.floor(c.visits/every),avail=Math.max(0,earned-(c.rewardsUsed||0));
  const fav=Object.entries(c.services||{}).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);
  const att=c.visits+c.noshows;
  return {gap,since,status,next:c.last&&gap?addDaysK(c.last,gap):null,avgTicket:c.visits?Math.round(c.spend/c.visits):0,
    noshowRate:att?Math.round(c.noshows*100/att):0,tier:tierOf(c.visits),avail,progress:c.visits%every,every,fav,
    isNew:c.first>=Date.UTC(+S.today.slice(0,4),+S.today.slice(5,7)-1,1)-3*3600e3,ltv:c.spend+(c.productSpend||0)};
}

function reportData(list){
  const [from,to]=periodRange(A.period);
  const by=s=>list.filter(b=>b.status===s);
  const arrived=by('arrived'),noshow=by('noshow'),cancelled=by('cancelled'),confirmed=by('confirmed');
  const live=[...arrived,...confirmed];
  const sum=a=>a.reduce((x,b)=>x+b.price,0);
  const workDays=new Set(arrived.map(b=>b.date)).size||1;
  const group=(keyFn,nameFn)=>{const m=new Map();live.forEach(b=>{const k=keyFn(b);const g=m.get(k)||{name:nameFn(b),n:0,rev:0};g.n++;if(b.status==='arrived')g.rev+=b.price;m.set(k,g)});return [...m.values()].sort((a,b)=>b.rev-a.rev||b.n-a.n)};
  const cm=new Map();arrived.forEach(b=>{const c=cm.get(b.phone)||{name:b.name,phone:b.phone,n:0,rev:0};c.n++;c.rev+=b.price;cm.set(b.phone,c)});
  const fromTs=Date.UTC(+from.slice(0,4),+from.slice(5,7)-1,+from.slice(8,10))-3*3600e3,toTs=Date.UTC(+to.slice(0,4),+to.slice(5,7)-1,+to.slice(8,10)+1)-2*3600e3;
  const prod=(A.orders||[]).filter(o=>o.status==='picked'&&o.created>=fromTs&&o.created<toTs).reduce((a,o)=>a+o.total,0);
  return {from,to,total:live.length+noshow.length,arrived:arrived.length,noshow:noshow.length,cancelled:cancelled.length,revenue:sum(arrived),prod,expected:sum(confirmed),
    avg:Math.round(sum(arrived)/workDays),rate:arrived.length+noshow.length?Math.round(noshow.length*100/(arrived.length+noshow.length)):0,
    bySvc:group(b=>b.serviceId,b=>tx(b.serviceName)),byStaff:group(b=>b.staffId,b=>tx(stf(b.staffId)?.name)||'—'),
    byDay:[0,1,2,3,4,5,6].map(i=>live.filter(b=>wd(b.date)===i).length),top:[...cm.values()].sort((a,b)=>b.rev-a.rev||b.n-a.n).slice(0,5)};
}

document.addEventListener('input',e=>{
  const el=e.target,d=el.dataset;
  if(d.j){let v=el.value;if(d.j==='slug'){v=v.toLowerCase().replace(/[^a-z0-9-]/g,'');if(v!==el.value)el.value=v;J.f.slug=v;checkSlug(v);return}J.f[d.j]=v;return}
  if(el.id==='fName'){cb.name=el.value;return}
  if(el.id==='fPhone'){cb.phone=el.value;return}
  if(el.id==='sName'){shop.name=el.value;return}
  if(el.id==='sPhone'){shop.phone=el.value;return}
  if(el.id==='sNote'){shop.note=el.value;return}
  if(!A.biz)return;
  if(el.id==='cSearch'){A.q=el.value;document.getElementById('clist').innerHTML=clientRows(A.clients.map(c=>({c,a:analyze(c)})));return}
  if(d.sv){const x=A.biz.services.find(s=>s.id===d.sv);if(!x)return;if(d.f==='he'||d.f==='ar')x.name[d.f]=el.value;else x[d.f]=Math.max(0,+el.value||0);saveConfig();return}
  if(d.sf){const p=A.biz.staff.find(s=>s.id===d.sf);if(p){p.name[d.f]=el.value;saveConfig()}return}
  if(d.pp&&d.f!=='active'){const p=A.biz.products.find(s=>s.id===d.pp);if(!p)return;
    if(d.f==='he'||d.f==='ar')p.name[d.f]=el.value;else if(d.f==='dhe')p.desc.he=el.value;else if(d.f==='dar')p.desc.ar=el.value;else p[d.f]=Math.max(0,+el.value||0);saveConfig();return}
  if(d.pk&&el.type!=='checkbox'&&el.tagName!=='SELECT'){const k=A.biz.packages.find(x=>x.id===d.pk);if(!k)return;if(d.f==='he'||d.f==='ar')k.name[d.f]=el.value;else k[d.f]=Math.max(0,+el.value||0);saveConfig();return}
  if(d.biz){A.biz.name[d.biz]=el.value;saveConfig();return}
  if(d.bf){A.biz[d.bf]=el.value;saveConfig();return}
  if(d.club){A.biz.club.reward[d.club]=el.value;saveConfig();return}
  if(d.tag2){A.biz.tagline[d.tag2]=el.value;saveConfig();return}
  if(d.soc){A.biz.social[d.soc]=el.value.trim();saveConfig();return}
  if(el.id==='colorPick'){A.biz.theme.accent=el.value;applyTheme(A.biz.theme,A.biz.type);saveConfig();return}
  if(el.id==='clubEvery'){A.biz.club.rewardEvery=Math.max(2,Math.min(50,+el.value||10));saveConfig();return}
});
document.addEventListener('change',async e=>{
  const el=e.target,d=el.dataset;
  if(d.suplan){try{await suPost('biz',{slug:d.suplan,action:'plan',plan:el.value});toast(t('saved'));suLoad()}catch(err){toast(errMsg(err.code))}return}
  if(!A.biz)return;
  if(d.hr!=null){const h=A.biz.hours[+d.hr];if(d.f==='open')h.open=el.checked;else h[d.f]=el.value;render();saveConfig();return}
  if(d.shr!=null){const st=A.biz.staff.find(x=>x.id===d.sid);const h=st.hours[+d.shr];if(d.f==='open')h.open=el.checked;else h[d.f]=el.value;render();saveConfig();return}
  if(d.ownh){const st=A.biz.staff.find(x=>x.id===d.ownh);st.hours=el.checked?A.biz.hours.map(h=>({...h})):null;render();saveConfig(true);return}
  if(d.nt){A.biz.notify={...A.biz.notify,[d.nt]:el.checked};saveConfig(true);return}
  if(el.id==='ntPhone'){const v=el.value.replace(/\D/g,'');if(v&&!/^0?5\d{8}$|^9725\d{8}$/.test(v)){toast(errMsg('bad_phone'));return}A.biz.notify={...A.biz.notify,phone:v};saveConfig(true);return}
  if(d.pk&&(el.type==='checkbox'||el.tagName==='SELECT')){const k=A.biz.packages.find(x=>x.id===d.pk);if(!k)return;if(el.type==='checkbox')k.active=el.checked;else k.serviceId=el.value;render();saveConfig(true);return}
  if(d.pp&&d.f==='active'){const p=A.biz.products.find(s=>s.id===d.pp);p.active=el.checked;saveConfig(true);return}
  if(el.id==='cutSel'){A.biz.cutoff=+el.value;saveConfig(true);return}
  if(el.id==='clubOn'){A.biz.club.enabled=el.checked;render();saveConfig(true);return}
  if(el.id==='clubEvery'){render();return}
  if(el.id==='logoFile'&&el.files[0]){uploadLogo(el.files[0]);return}
  if(d.itemimg&&el.files[0]){uploadItemImg(d.itemimg,el.files[0]);return}
  if(d.spinup&&el.files[0]){uploadSpin(d.spinup,el.files[0]);return}
  if(el.id==='galFile'&&el.files.length){uploadGallery(el.files);return}
  if(el.id==='colorPick'){render();return}
  if(d.reply){api('POST',`/admin/${A.biz.slug}/review-reply`,{id:d.reply,reply:el.value},A.pin).then(()=>toast(t('saved')),err=>toast(errMsg(err.code)));return}
  if(el.id==='cNotes'){updClient(d.cphone,{notes:el.value});return}
  if(el.id==='cBday'){const v=el.value.trim();if(v&&!/^\d{2}-\d{2}$/.test(v)){toast('DD-MM');return}updClient(d.cphone,{birthday:v});return}
});

document.addEventListener('click',e=>{if(e.target.id==='spov')close360()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close360()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='simIn'){e.preventDefault();simSend(e.target.value.trim())}});

/* ===================== boot ===================== */
if(PREVIEW){
  const nav=document.createElement('div');nav.className='seg';nav.id='pvNav';
  document.querySelector('.top .sp').after(nav);
  const paintNav=()=>{nav.innerHTML=`<a href="#join" class="${MODE==='join'?'on':''}">${lang==='ar'?'البيع':'מכירה'}</a><a href="#b-demo" class="${MODE==='book'||MODE==='manage'?'on':''}">${lang==='ar'?'الزبون':'לקוח'}</a><a href="#admin-demo" class="${MODE==='admin'?'on':''}">${lang==='ar'?'الإدارة':'ניהול'}</a><a href="#super" class="${MODE==='super'?'on':''}">TorLink</a>`};
  const _render=render;render=function(){_render();paintNav()};
  window.addEventListener('hashchange',()=>{P=parseRoute();setMode();resetState();window.scrollTo(0,0);boot()});
}
async function boot(){
  render();
  try{
    if(MODE==='admin'){const p=store.sget('tl-pin-'+KEY);if(p)login(p);else render();return}
    if(MODE==='join'){const r=await api('GET','/platform');J.plans=r.plans;J.payInfo=r.payInfo;J.contact=r.contact;J.plan=J.plan||r.plans[r.plans.length-1].id;render();return}
    if(MODE==='super'){if(SU.key)suLoad();else render();return}
    if(MODE==='card'){
      const r=await api('GET','/card/'+encodeURIComponent(KEY));
      S.biz=r.biz;S.today=r.today;CD=r;
    }else if(MODE==='manage'){
      const r=await api('GET','/booking/'+encodeURIComponent(KEY));
      S.biz=r.biz;S.today=r.today;mg.data=r;
    }else{
      const r=await api('GET','/biz/'+encodeURIComponent(KEY));
      S.biz=r.biz;S.today=r.today;S.waBot=r.waBot||'';cb=freshCb();
      api('GET','/extras/'+encodeURIComponent(KEY)).then(x=>{S.reviews=x.reviews;if(cb&&cb.step===0&&!cb.done)render()}).catch(()=>{});
    }
    if(!PREVIEW&&S.biz){
      // "install as app" with the business' own name, colors and logo
      const add=(rel,href)=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l)};
      add('manifest','/api/manifest/'+S.biz.slug+(MODE==='card'?'?card='+encodeURIComponent(KEY):''));
      if(S.biz.logoV){add('icon','/api/img/'+S.biz.slug+'/logo?v='+S.biz.logoV);add('apple-touch-icon','/api/img/'+S.biz.slug+'/logo?v='+S.biz.logoV)}
    }
  }catch(e){S.loadErr=e.code}
  render();
}
boot();
</script>
