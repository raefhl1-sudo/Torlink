<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TorLink</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1d1b19;--muted:#77716a;--line:#e7e2db;--brand:#1f6f5c;--brand-2:#e9f3f0;--danger:#b84a3a;--ok:#2f7d4f;--warn:#a87a14;--wa:#1fa855;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:Rubik,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:18px}.logo span{color:#7fd1b9}
.sp{flex:1}
.seg{display:flex;background:#ffffff1a;border-radius:10px;padding:3px}
.seg button{background:none;border:0;color:#fff;padding:6px 12px;border-radius:8px;font-size:14px}
.seg button.on{background:#fff;color:var(--ink);font-weight:600}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.biz{display:flex;gap:14px;align-items:center}
.biz-ic{width:56px;height:56px;border-radius:16px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:26px;flex:none}
.biz h1{margin:0;font-size:20px}.biz p{margin:2px 0 0;color:var(--muted);font-size:13px}
.steps{display:flex;gap:6px;margin:4px 0 14px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--brand)}
h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 8px}
.list{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.opt:hover{border-color:var(--brand)}
.opt .n{font-weight:600}.opt .m{color:var(--muted);font-size:13px}.opt .pr{margin-inline-start:auto;font-weight:600;white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand-2);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;min-width:62px;text-align:center}
.chip b{display:block;font-size:17px}.chip small{color:var(--muted);font-size:12px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}.chip.on small{color:#ffffffcc}
.chip:disabled{opacity:.4;cursor:not-allowed}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px}
.pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:12px}
.slot{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font-weight:600;direction:ltr}
.slot:hover{border-color:var(--brand)}
.empty{color:var(--muted);text-align:center;padding:18px 6px}
label.f{display:block;margin-bottom:10px}label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=tel],input[type=number],input[type=time],input[type=password],select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--brand)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--brand);color:#fff;text-decoration:none;display:inline-block;text-align:center}
.btn.full{width:100%}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}.btn.danger{background:var(--danger)}.btn.wa{background:var(--wa)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.back{background:none;border:0;color:var(--muted);padding:0;margin-bottom:10px;font-size:14px}
.sum{background:var(--brand-2);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.sum div{display:flex;justify-content:space-between;padding:3px 0;gap:10px}.sum div span:first-child{color:var(--muted)}
.sum .old{text-decoration:line-through;color:var(--muted)}
.ok-ic{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:32px;margin:6px auto 10px}
.ok-ic.x{background:var(--muted)}
.center{text-align:center}
.wa-box{background:#e7f8e9;border-radius:12px;padding:12px;margin-top:12px}
.wa-box .lbl{font-size:12px;color:#2c7a3e;font-weight:600;margin-bottom:6px}
.bub{background:#fff;border-radius:10px 10px 10px 2px;padding:10px 12px;font-size:14px;box-shadow:0 1px 1px #0001;white-space:pre-line;word-break:break-word}
.err{color:var(--danger);font-size:13px;margin:6px 0}
.info-box{background:#fff7e8;border:1px solid #f0dcb5;border-radius:12px;padding:10px 12px;font-size:13px;color:#6b5320;margin-bottom:12px}
.ok-box{background:#e3f3e8;border:1px solid #bfe0c9;border-radius:12px;padding:10px 12px;font-size:13px;color:#245c37;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-size:14px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.stat.hl{background:var(--brand);color:#fff;border-color:var(--brand)}.stat.hl span{color:#ffffffcc}
.staff-h{font-weight:600;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.bk{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff;border-inline-start:4px solid var(--brand)}
.bk.arrived{border-inline-start-color:var(--ok)}.bk.noshow{border-inline-start-color:var(--danger);opacity:.8}.bk.cancelled{border-inline-start-color:var(--line);opacity:.55}
.bk .tm{font-weight:700;direction:ltr;min-width:48px}.bk .tm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.bk .info{flex:1;min-width:0}.bk .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--brand-2);color:var(--brand);font-weight:600;white-space:nowrap}
.badge.arrived,.badge.sent{background:#e3f3e8;color:var(--ok)}.badge.noshow,.badge.failed,.badge.blocked{background:#f7e4e1;color:var(--danger)}
.badge.cancelled{background:#eee;color:#777}.badge.demo{background:#fff3dc;color:var(--warn)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:500}td.num,th.num{text-align:end;white-space:nowrap}
.ed{display:grid;grid-template-columns:1fr 1fr 70px 70px 36px;gap:6px;align-items:center;margin-bottom:8px}.ed input{padding:8px}
.x{background:none;border:0;color:var(--danger);font-size:20px;line-height:1}.x:disabled{opacity:.25}
.hrs{display:grid;grid-template-columns:90px 50px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.link{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 12px;direction:ltr;font-size:14px;word-break:break-all}
.note{font-size:13px;color:var(--muted)}
.bar{display:grid;grid-template-columns:60px 1fr 40px;gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--brand)}.bar .tr{background:var(--brand-2);border-radius:6px}
.msg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.msg .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:13px}
.msg .bub{background:#f1fbf3;box-shadow:none;font-size:13px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;margin:24px auto}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (max-width:520px){.ed{grid-template-columns:1fr 1fr 58px 58px 28px}.stats b{font-size:19px}}
</style>
</head>

async function api(method,url,body,pin){
  let res;
  try{res=await fetch('/api'+url,{method,headers:{'content-type':'application/json',...(pin?{'x-admin-pin':pin}:{})},body:body?JSON.stringify(body):undefined})}
  catch(e){throw {code:'network'}}
  const j=await res.json().catch(()=>({}));
  if(!res.ok)throw {code:j.error||'server_error',status:res.status};
  return j;
}

async function submitBooking(){
  cb.err='';
  try{
    cb.busy=true;render();
    if(cb.resched){
      const r=await api('POST',`/booking/${cb.resched}/reschedule`,{date:cb.date,time:cb.time,staffId:cb.staffId});
      cb.done=r;
    }else{
      const name=cb.name.trim(),phone=cb.phone.replace(/\D/g,'');
      if(!name)throw {code:'bad_name'};
      if(!/^05\d{8}$/.test(phone))throw {code:'bad_phone'};
      store.set('tl-name',name);store.set('tl-phone',cb.phone);
      cb.done=await api('POST','/book',{slug:S.biz.slug,serviceId:cb.serviceId,staffId:cb.staffId,date:cb.date,time:cb.time,name,phone,lang});
    }
    window.scrollTo(0,0);
  }catch(e){
    if(e.code==='taken'){cb.step=2;cb.err=errMsg('taken');loadSlots()}
    else cb.err=errMsg(e.code,S.biz.cutoff);
  }
  cb.busy=false;render();
}

async function getRange(from,to,force){
  const key=from+'_'+to;
  if(!force&&A.cache[key])return A.cache[key];
  const r=await api('GET',`/admin/${A.biz.slug}/bookings?from=${from}&to=${to}`,null,A.pin);
  A.cache[key]=r.bookings;return r.bookings;
}
const calRange=()=>[addDaysK(S.today,-3),addDaysK(S.today,14)];
function periodRange(p){
  const td=S.today,y=+td.slice(0,4),m=+td.slice(5,7);
  if(p==='week'){const s=addDaysK(td,-wd(td));return [s,addDaysK(s,6)]}
  const last=(yy,mm)=>new Date(Date.UTC(yy,mm,0)).getUTCDate();
  if(p==='month')return [`${y}-${pad(m)}-01`,`${y}-${pad(m)}-${pad(last(y,m))}`];
  if(p==='last'){const yy=m===1?y-1:y,mm=m===1?12:m-1;return [`${yy}-${pad(mm)}-01`,`${yy}-${pad(mm)}-${pad(last(yy,mm))}`]}
  return [addDaysK(td,-29),td];
}

}

function reportData(list){
  const [from,to]=periodRange(A.period);
  const by=s=>list.filter(b=>b.status===s);
  const arrived=by('arrived'),noshow=by('noshow'),cancelled=by('cancelled'),confirmed=by('confirmed');
  const live=[...arrived,...confirmed];
  const sum=a=>a.reduce((x,b)=>x+b.price,0);
  const workDays=new Set(arrived.map(b=>b.date)).size||1;
  const group=(keyFn,nameFn)=>{const m=new Map();live.forEach(b=>{const k=keyFn(b);const g=m.get(k)||{name:nameFn(b),n:0,rev:0};g.n++;if(b.status==='arrived')g.rev+=b.price;m.set(k,g)});return [...m.values()].sort((a,b)=>b.rev-a.rev||b.n-a.n)};
  const cm=new Map();arrived.forEach(b=>{const c=cm.get(b.phone)||{name:b.name,n:0,rev:0};c.n++;c.rev+=b.price;cm.set(b.phone,c)});
  return {from,to,total:live.length+noshow.length,arrived:arrived.length,noshow:noshow.length,cancelled:cancelled.length,revenue:sum(arrived),expected:sum(confirmed),
    avg:Math.round(sum(arrived)/workDays),rate:arrived.length+noshow.length?Math.round(noshow.length*100/(arrived.length+noshow.length)):0,
    bySvc:group(b=>b.serviceId,b=>tx(b.serviceName)),byStaff:group(b=>b.staffId,b=>tx(stf(b.staffId)?.name)||'—'),
    byDay:[0,1,2,3,4,5,6].map(i=>live.filter(b=>wd(b.date)===i).length),top:[...cm.values()].sort((a,b)=>b.n-a.n||b.rev-a.rev).slice(0,5)};
}
function admReport(){
  const per=[['week','pWeek'],['month','pMonth'],['last','pLast'],['30','p30']];
  let h=`<div class="pills">${per.map(([k,l])=>`<button class="pill ${A.period===k?'on':''}" data-period="${k}">${t(l)}</button>`).join('')}</div>`;
  if(!tabData)return h+spin;
  const R=reportData(tabData);
  h+=`<p class="note" style="margin:-4px 0 10px">${fmtDate(R.from)} – ${fmtDate(R.to)}</p>
  <div class="stats two"><div class="stat hl"><b>${R.revenue.toLocaleString()} ₪</b><span>${t('rRevenue')}</span></div><div class="stat"><b>${R.expected.toLocaleString()} ₪</b><span>${t('rExpected')}</span></div></div>
  <div class="stats"><div class="stat"><b>${R.total}</b><span>${t('rBookings')}</span></div><div class="stat"><b>${R.arrived}</b><span>${t('rArrived')}</span></div><div class="stat"><b>${R.noshow}</b><span>${t('rNoshow')}</span></div>
  <div class="stat"><b>${R.cancelled}</b><span>${t('rCancelled')}</span></div><div class="stat"><b>${R.rate}%</b><span>${t('rNoshowRate')}</span></div><div class="stat"><b>${R.avg} ₪</b><span>${t('rAvg')}</span></div></div>
  <div class="card"><h3 style="margin-top:0">${t('rByService')}</h3><table><tr><th>${t('service')}</th><th class="num">${t('rCount')}</th><th class="num">${t('rRevenue')}</th></tr>${R.bySvc.map(x=>`<tr><td>${esc(x.name)}</td><td class="num">${x.n}</td><td class="num">${x.rev.toLocaleString()} ₪</td></tr>`).join('')}</table>`;
  if(!single())h+=`<h3>${t('rByStaff')}</h3><table>${R.byStaff.map(x=>`<tr><td>${esc(x.name)}</td><td class="num">${x.n}</td><td class="num">${x.rev.toLocaleString()} ₪</td></tr>`).join('')}</table>`;
  const mx=Math.max(1,...R.byDay);
  h+=`<h3>${t('rByDay')}</h3>`+R.byDay.map((n,i)=>A.biz.hours[i].open||n?`<div class="bar"><span>${t('days')[i]}</span><div class="tr"><i style="width:${n*100/mx}%"></i></div><b class="num">${n}</b></div>`:'').join('');
  if(R.top.length)h+=`<h3>${t('rTop')}</h3><table>${R.top.map(c=>`<tr><td>${esc(c.name)}</td><td class="num">${c.n} ${t('visits')}</td><td class="num">${c.rev.toLocaleString()} ₪</td></tr>`).join('')}</table>`;
  return h+`<button class="btn wa full" style="margin-top:14px" data-a="copyReport">📋 ${t('rCopy')}</button></div>`;
}
function reportText(){
  const R=reportData(tabData||[]);
  const L=[`📊 ${t('rTitle')} – ${tx(A.biz.name)}`,`${fmtDate(R.from)} – ${fmtDate(R.to)}`,'',`💰 ${t('rRevenue')}: ${R.revenue.toLocaleString()} ₪`,`⏳ ${t('rExpected')}: ${R.expected.toLocaleString()} ₪`,
    `📅 ${t('rBookings')}: ${R.total} | ${t('rArrived')}: ${R.arrived} | ${t('rNoshow')}: ${R.noshow} | ${t('rCancelled')}: ${R.cancelled}`,`⚠️ ${t('rNoshowRate')}: ${R.rate}%`,`📈 ${t('rAvg')}: ${R.avg} ₪`,'',`✂️ ${t('rByService')}:`];
  R.bySvc.forEach(x=>L.push(`• ${x.name}: ${x.n} – ${x.rev.toLocaleString()} ₪`));
  if(!single()){L.push('',`👤 ${t('rByStaff')}:`);R.byStaff.forEach(x=>L.push(`• ${x.name}: ${x.n} – ${x.rev.toLocaleString()} ₪`))}
  return L.join('\n');
}
function admMsgs(){
  if(!tabData)return spin;
  let h=`<div class="${A.wa?'ok-box':'info-box'}">${A.wa?t('waOn'):t('waOff')}</div><p class="note">${t('waInfo')}</p>
  <div class="card"><h3 style="margin-top:0">${t('testTitle')}</h3><div class="row"><input type="tel" id="testPhone" placeholder="05X-XXXXXXX" dir="ltr" value="${esc(store.get('tl-test')||'')}"><button class="btn sm wa" data-a="test" style="padding:10px 14px">${t('testBtn')}</button></div></div><div class="card">`;
  if(!tabData.length)h+=`<div class="empty">${t('noMsgs')}</div>`;
  h+=tabData.map(m=>`<div class="msg"><div class="hd"><b>${esc(m.name)}</b><span dir="ltr" class="note">${esc(m.phone)}</span><span class="badge">${t('ty_'+m.type)}</span><span class="badge ${m.status}">${t('m_'+m.status)}</span><span class="note">${fmtStamp(m.at)}</span></div>
    <div class="bub">${esc(m.text)}</div>${m.error?`<div class="err">${esc(m.error)}</div>`:''}</div>`).join('');
  return h+`</div>`;
}
function admClients(){
  if(!tabData)return spin;
  const m=new Map();
  tabData.forEach(b=>{const c=m.get(b.phone)||{name:b.name,phone:b.phone,visits:0,nos:0};if(b.status==='arrived')c.visits++;if(b.status==='noshow')c.nos++;m.set(b.phone,c)});
  A.biz.blocked.forEach(p=>{if(!m.has(p))m.set(p,{name:'—',phone:p,visits:0,nos:0})});
  const rows=[...m.values()].sort((a,b)=>b.visits-a.visits);
  if(!rows.length)return `<div class="card empty">${t('noClients')}</div>`;
  return `<div class="card"><p class="note" style="margin-top:0">${t('blockNote')}</p><table><tr><th>${t('name')}</th><th>${t('phone')}</th><th class="num">${t('visits')}</th><th class="num">${t('nos')}</th><th></th></tr>`+
    rows.map(c=>{const bl=A.biz.blocked.includes(c.phone);return `<tr><td>${esc(c.name)}</td><td dir="ltr" style="text-align:end">${esc(c.phone)}</td><td class="num">${c.visits}</td><td class="num">${c.nos?`<span class="badge noshow">${c.nos}</span>`:'0'}</td><td class="num"><button class="btn sm ${bl?'ghost':'danger'}" data-blk="${esc(c.phone)}">${bl?t('unblock'):t('block')}</button></td></tr>`}).join('')+`</table></div>`;
}
function admServices(){
  return `<div class="card"><div class="ed note"><span>${t('nameHe')}</span><span>${t('nameAr')}</span><span>${t('dur')}</span><span>₪</span><span></span></div>`+
  A.biz.services.map(x=>`<div class="ed"><input type="text" data-sv="${x.id}" data-f="he" value="${esc(x.name.he)}"><input type="text" data-sv="${x.id}" data-f="ar" value="${esc(x.name.ar)}"><input type="number" min="5" step="5" data-sv="${x.id}" data-f="dur" value="${x.dur}"><input type="number" min="0" data-sv="${x.id}" data-f="price" value="${x.price}"><button class="x" data-delsv="${x.id}" ${A.biz.services.length<2?'disabled':''}>×</button></div>`).join('')+
  `<button class="btn ghost full" data-a="addSv">${t('add')}</button></div>`;
}
function admHours(){
  return `<div class="card"><p class="note" style="margin-top:0">${t('hoursNote')}</p>`+A.biz.hours.map((x,i)=>`<div class="hrs"><b>${t('days')[i]}</b><input type="checkbox" data-hr="${i}" data-f="open" ${x.open?'checked':''} style="width:20px;height:20px"><input type="time" data-hr="${i}" data-f="from" value="${x.from}" ${x.open?'':'disabled'}><input type="time" data-hr="${i}" data-f="to" value="${x.to}" ${x.open?'':'disabled'}></div>`).join('')+`</div>`;
}
function admSettings(){
  const link=SITE+'/b/'+A.biz.slug;
  return `<div class="card"><label class="f"><span>${t('bizName')} (עב)</span><input type="text" data-biz="he" value="${esc(A.biz.name.he)}"></label>
   <label class="f"><span>${t('bizName')} (عر)</span><input type="text" data-biz="ar" value="${esc(A.biz.name.ar)}"></label>
   <label class="f"><span>${t('bookLink')}</span></label><div class="link"><span style="flex:1">${esc(link)}</span><button class="btn sm" data-a="copyLink">${t('copy')}</button><a class="btn sm ghost" href="${PREVIEW?href('/b/'+A.biz.slug):esc(link)}" ${PREVIEW?'':'target="_blank" rel="noopener"'}>${t('open')}</a></div>
   <p class="note">${t('linkNote')}</p></div>
   <div class="card"><h2>${t('staffTitle')}</h2><p class="note" style="margin-top:-6px">${t('staffNote')}</p>
   ${A.biz.staff.map(p=>`<div class="ed" style="grid-template-columns:1fr 1fr 36px"><input type="text" data-sf="${p.id}" data-f="he" value="${esc(p.name.he)}" placeholder="${t('nameHe')}"><input type="text" data-sf="${p.id}" data-f="ar" value="${esc(p.name.ar)}" placeholder="${t('nameAr')}"><button class="x" data-delsf="${p.id}" ${single()?'disabled':''}>×</button></div>`).join('')}
   <button class="btn ghost full" data-a="addSf">${t('addStaff')}</button></div>
   <div class="card"><label class="f"><span>${t('cutoff')}</span><select id="cutSel">${[0,1,2,3,6,12,24].map(n=>`<option value="${n}" ${A.biz.cutoff===n?'selected':''}>${n}</option>`).join('')}</select></label></div>
   <div class="card"><label class="f"><span>${t('newPin')}</span><input type="password" inputmode="numeric" id="newPin" dir="ltr"></label><button class="btn ghost full" data-a="savePin">${t('savePin')}</button></div>`;
}
let saveTimer=null;
function saveConfig(now){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{const {name,services,staff,hours,cutoff,blocked}=A.biz;const r=await api('PUT',`/admin/${A.biz.slug}/config`,{name,services,staff,hours,cutoff,blocked},A.pin);A.biz=r.biz;S.biz=r.biz;toast(t('saved'))}
    catch(e){if(e.code==='bad_pin')return logout();toast(errMsg(e.code))}
  },now?0:800);
}
async function login(pin){
  A.loading=true;A.err='';render();
  try{const r=await api('POST',`/admin/${KEY}/login`,{},pin);A.pin=pin;A.biz=r.biz;A.wa=r.waConnected;S.biz=r.biz;S.today=r.today;store.sset('tl-pin-'+KEY,pin);A.loading=false;loadTab()}
  catch(e){A.loading=false;store.sset('tl-pin-'+KEY,null);A.err=errMsg(e.code);render()}
}
function logout(){store.sset('tl-pin-'+KEY,null);A.biz=null;A.pin=null;A.cache={};render()}
function copyText(txt){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('copied'))}catch(e){}ta.remove()};
  try{navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),fb)}catch(e){fb()}
}

/* ===================== events ===================== */
document.addEventListener('click',async e=>{
  const el=e.target.closest('button');if(!el)return;
  const d=el.dataset;
  if(d.l){lang=d.l;store.set('tl-lang',lang);render();return}
  // booking
  if(d.svc){cb.serviceId=d.svc;if(single()){cb.staffId=S.biz.staff[0].id;cb.step=2;cb.date=cb.date||firstOpen();loadSlots()}else{cb.step=1;render()}return}
  if(d.stf){cb.staffId=d.stf;cb.step=2;cb.date=cb.date||firstOpen();loadSlots();return}
  if(d.date){cb.date=d.date;loadSlots();return}
  if(d.time){cb.time=d.time;cb.staffId=d.sid;cb.step=3;cb.err='';render();window.scrollTo(0,0);return}
  if(d.a==='back'){
    if(cb.resched&&cb.step===2){cb=null;render();return}
    cb.err='';if(cb.step===3){cb.step=2;loadSlots();return}
    cb.step=cb.step===2&&!single()?1:0;render();return}
  if(d.a==='book'){submitBooking();return}
  // manage
  if(d.a==='resched'){const b=mg.data.booking;cb={...freshCb(),resched:b.id,serviceId:b.serviceId,staffId:b.staffId,date:b.date,step:2};loadSlots();return}
  if(d.a==='cancelMine'){
    if(!mg.confirm){mg.confirm=true;render();return}
    el.disabled=true;
    try{const r=await api('POST',`/booking/${KEY}/cancel`);mg.data.booking=r.booking;mg.msg=r.message}catch(err){mg.err=errMsg(err.code,S.biz.cutoff)}
    mg.confirm=false;render();return}
  // admin
  if(d.a==='login'){const v=document.getElementById('pinIn').value.trim();if(v)login(v);return}
  if(d.a==='logout'){logout();return}
  if(d.tab){A.tab=d.tab;A.confirm=null;loadTab();return}
  if(d.adate){A.date=d.adate;render();return}
  if(d.a==='refresh'){A.cache={};loadTab(true);return}
  if(d.period){A.period=d.period;loadTab();return}
  if(d.st){
    if(d.st==='cancelled'&&A.confirm!=='c'+d.id){A.confirm='c'+d.id;render();return}
    A.confirm=null;
    const b=tabData.find(x=>x.id===d.id);const prev=b.status;b.status=d.st;render();
    try{await api('POST',`/admin/${A.biz.slug}/status`,{date:d.d,id:d.id,status:d.st},A.pin)}catch(err){b.status=prev;render();toast(errMsg(err.code))}
    return}
  if(d.a==='copyReport'){copyText(reportText());return}
  if(d.a==='copyLink'){copyText(SITE+'/b/'+A.biz.slug);return}
  if(d.a==='test'){
    const ph=document.getElementById('testPhone').value.replace(/\D/g,'');
    if(!/^05\d{8}$/.test(ph)){toast(errMsg('bad_phone'));return}
    store.set('tl-test',ph);el.disabled=true;
    try{const r=await api('POST',`/admin/${A.biz.slug}/test-message`,{phone:ph,lang},A.pin);toast(t('m_'+r.message.status));loadTab()}catch(err){toast(errMsg(err.code));el.disabled=false}
    return}
  if(d.a==='addSv'){A.biz.services.push({id:rid(),name:{he:'',ar:''},dur:30,price:50});render();saveConfig();return}
  if(d.delsv){if(A.biz.services.length>1){A.biz.services=A.biz.services.filter(x=>x.id!==d.delsv);render();saveConfig()}return}
  if(d.a==='addSf'){A.biz.staff.push({id:rid(),name:{he:'',ar:''}});render();saveConfig();return}
  if(d.delsf){if(!single()){A.biz.staff=A.biz.staff.filter(x=>x.id!==d.delsf);render();saveConfig()}return}
  if(d.blk){A.biz.blocked=A.biz.blocked.includes(d.blk)?A.biz.blocked.filter(p=>p!==d.blk):[...A.biz.blocked,d.blk];render();saveConfig(true);return}
  if(d.a==='savePin'){
    const v=document.getElementById('newPin').value.trim();
    if(!/^\d{4,8}$/.test(v)){toast(errMsg('bad_pin'));return}
    try{await api('PUT',`/admin/${A.biz.slug}/config`,{pin:v},A.pin);A.pin=v;store.sset('tl-pin-'+KEY,v);toast(t('saved'));document.getElementById('newPin').value=''}catch(err){toast(errMsg(err.code))}
    return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pinIn'){const v=e.target.value.trim();if(v)login(v)}});
document.addEventListener('input',e=>{
  const el=e.target,d=el.dataset;
  if(el.id==='fName'){cb.name=el.value;return}
  if(el.id==='fPhone'){cb.phone=el.value;return}
  if(!A.biz)return;
  if(d.sv){const x=A.biz.services.find(s=>s.id===d.sv);if(!x)return;if(d.f==='he'||d.f==='ar')x.name[d.f]=el.value;else x[d.f]=Math.max(0,+el.value||0);saveConfig();return}
  if(d.sf){const p=A.biz.staff.find(s=>s.id===d.sf);if(p){p.name[d.f]=el.value;saveConfig()}return}
  if(d.biz){A.biz.name[d.biz]=el.value;saveConfig();return}
});
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;if(!A.biz)return;
  if(d.hr!=null){const h=A.biz.hours[+d.hr];if(d.f==='open')h.open=el.checked;else h[d.f]=el.value;render();saveConfig();return}
  if(el.id==='cutSel'){A.biz.cutoff=+el.value;saveConfig(true)}
});

/* ===================== boot ===================== */
if(PREVIEW){
  const nav=document.createElement('div');nav.className='seg';nav.id='pvNav';
  document.querySelector('.top .sp').after(nav);
  const paintNav=()=>{nav.innerHTML=`<a href="#b-demo" style="color:#fff;text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px;${MODE!=='admin'?'background:#fff;color:#1d1b19;font-weight:600':''}">${lang==='ar'?'الزبون':'לקוח'}</a><a href="#admin-demo" style="color:#fff;text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px;${MODE==='admin'?'background:#fff;color:#1d1b19;font-weight:600':''}">${lang==='ar'?'الإدارة':'ניהול'}</a>`};
  const _render=render;render=function(){_render();paintNav()};
  window.addEventListener('hashchange',()=>{
    P=parseRoute();MODE=P[0]==='m'?'manage':P[0]==='admin'?'admin':'book';KEY=P[1]||'demo';
    S={biz:null,today:null,loadErr:null};cb=null;mg={data:null,confirm:false};tabData=null;
    A={pin:null,biz:null,wa:false,tab:'cal',date:null,period:'month',cache:{},msgs:null,confirm:null,loading:false,err:''};
    window.scrollTo(0,0);boot();
  });
}
async function boot(){
  render();
  try{
    if(MODE==='admin'){const p=store.sget('tl-pin-'+KEY);if(p)login(p);else render();return}
    if(MODE==='manage'){
      const r=await api('GET','/booking/'+encodeURIComponent(KEY));
      S.biz=r.biz;S.today=r.today;mg.data=r;
    }else{
      const r=await api('GET','/biz/'+encodeURIComponent(KEY));
      S.biz=r.biz;S.today=r.today;cb=freshCb();
    }
  }catch(e){S.loadErr=e.code}
  render();
}
boot();
</script>
</body>
