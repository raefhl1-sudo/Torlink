[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/b/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/m/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/super"
  to = "/index.html"
  status = 200
