[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/b/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/m/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/c/*"
  to = "/index.html"
  status = 200

# --- coming-soon mode: the public homepage and sign-up show soon.html.
# To launch: delete these two blocks (and /join goes back to index.html below).
[[redirects]]
  from = "/"
  to = "/soon.html"
  status = 200
  force = true

[[redirects]]
  from = "/join"
  to = "/soon.html"
  status = 200
  force = true

# private preview of the sales page while in coming-soon mode
[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/super"
  to = "/index.html"
  status = 200

# ---- caching: static assets are cached by the browser, pages stay fresh
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
